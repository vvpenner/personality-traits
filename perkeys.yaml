  # ==========================================================================
  # НЕДЕЛЯ 3. Защитный пессимизм
  # ==========================================================================

  - id: day_15_info
    delay_minutes: 1  # production: 1440
    text: |
      А что, если все пойдет не так?

      Поздравляем вас с началом 3 недели! Эта неделя будет посвящена концепции “защитного пессимизма”, которая предполагает, что порой наши негативные переживания защищают нас от плохого.

      Представьте, что вам предстоит важное выступление. Один человек думает: «Всё будет прекрасно!», а другой спрашивает себя: «А если я забуду слова? А если техника подведёт?» Кажется, что второй человек просто тревожится, но иногда такие мысли помогают лучше подготовиться – это и есть защитный пессимизм.

      Сегодня мы предлагаем вам практику “Офис”, направленную на развитие навыка наблюдать за своими мыслями со стороны – исследователи отмечают, что такой навык помогает действовать более осознанно.
    file:
      - День 15.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_15_practice

  - id: day_15_practice
    text: |
      Офис

      Сосредоточьтесь на несколько минут, чтобы как можно ярче представить данную сцену.

      Вы расстроены, поскольку только что поссорились с коллегой. Вскоре после этого вы видите в холле другую коллегу, которая быстро убегает, говоря вам, что у нее ни минуты свободного времени.

      Запишите мысли, которые придут вам на ум.

      Теперь представьте себе такую сцену.

      Вы чувствуете себя счастливым, потому что вас и вашу коллегу только что похвалили за хорошую работу. Вскоре после этого вы видите в зале еще одну коллегу, которая быстро убегает, говоря вам, что не может остаться ни на минуту.

      Запишите мысли, которые придут вам на ум.

      Теперь посмотрите, как вы описали свой ответ на два сценария. Запишите все, что поразило вас в своих мыслях о двух ситуациях.
    file:
      - День 15. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_15_outro

  - id: day_15_outro
    text: |
      Спасибо, что уделили время практике! Отличались ли ваши мысли в зависимости от ситуации? Как думаете, почему?

      Порой мы видим мир через призму наших мыслей, и именно они могут определять оттенок нашего восприятия. Но мысли не являются фактами, даже если они говорят, что так и есть!

  - id: day_16_info
    delay_minutes: 1  # production: 1440
    text: |
      План Б — тоже хороший план

      Вы собираетесь в поездку и тревожитесь, заранее проверяете документы, погоду и маршрут. Вы не обязательно ожидаете катастрофы – просто хотите быть готовым к неожиданностям.

      Защитный пессимизм работает похожим образом: человек представляет возможные сложности и заранее продумывает, как с ними справиться.

      Сегодня мы предлагаем вам практику “Поезд ассоциаций”: она эффективно помогает проанализировать собственные мысли с позиции наблюдателя, а значит – не увязнуть в клубке негатива и выстроить осознанную реакцию на происходящие события.
    file:
      - День 16.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_16_practice

  - id: day_16_practice
    text: |
      Поезд ассоциаций

      Закройте глаза и представьте, что вы сидите в кинотеатре. Но экран пустой, и вы смотрите на него.

      Подождите, когда начнут возникать ваши собственные мысли.

      Что именно они собой представляют? Что происходит с ними? Какие из них особенно завладевают нами и почему?
    file:
      - День 16. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_16_outro

  - id: day_16_outro
    text: |
      Спасибо, что уделили время практике! Как вы себя чувствуете после нее?

      Нам не нужно бороться с мыслями, сопротивляться им или судить их. Скорее, мы можем просто решить не следовать им, как только осознаем, что они возникают. Наша главная цель — ясно увидеть мысли, чтобы мы могли выбрать те, на основе которых будем действовать, и те, которые просто оставим.

  - id: day_17_info
    delay_minutes: 1  # production: 1440
    text: |
      Когда тревога помогает подготовиться

      «А вдруг я не справлюсь?» – эта мысль порой может мешать. Но иногда она побуждает человека потренироваться, уточнить информацию или подготовить необходимые материалы.

      Всё зависит от того, что происходит дальше: если беспокойство превращается в бесконечные переживания – оно истощает; если же становится поводом для подготовки – оно может помочь.

      Сегодня мы вновь предлагаем вам повторить любую из пройденных практик – это поможет закрепить новые навыки осознанного взаимодействия с собственной тревогой.
    file:
      - День 17.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_17_practice

  - id: day_17_practice
    text: |
      Повторение

      Найдите свободное время, чтобы посвятить его себе, а затем выберите понравившуюся вам практику и повторите её.
    file:
      - День 17. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_17_outro

  - id: day_17_outro
    text: |
      Спасибо, что уделили время практике! Удалось ли ощутить во время её выполнения что-то новое, что в прошлый раз не было замечено? Как думаете, почему?

  - id: day_18_info
    delay_minutes: 1  # production: 1440
    text: |
      Предусмотрительность – это не слабость

      Некоторые люди предпочитают заранее подумать о возможных проблемах: они проверяют детали, готовят запасные варианты и стараются ничего не упустить. Окружающим это иногда кажется излишним беспокойством.

      Но предусмотрительность может быть полезной, особенно когда цена ошибки высока.

      Сегодня мы предлагаем вам практику “Список приятных и эффективных действий”, которая помогает подготовить опору для себя в трудные минуты.
    file:
      - День 18.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_18_practice

  - id: day_18_practice
    text: |
      Список приятных и эффективных действий

      Оказывается, что, когда люди чувствуют себя подавленными, истощенными и испытывающими недостаток энергии, особенно эффективны в поднятии настроения два типа действий.

      Приятные действия – те, которые приносят чувство удовольствия или наслаждения (например, пригласить друга, чтобы поболтать, неторопливо принять горячую ванну или пойти на прогулку).

      Эффективные действия – те, которые приносят ощущения выполненного долга, удовлетворения или контроля (например, написать письмо, подстричь газон, сделать что-то, что вы давно откладывали).

      Попробуйте составить для себя сначала список приятных действий, а после – список эффективных действий. Напишите 5-10 таких действий в каждом списке.
    file:
      - День 18. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_18_outro

  - id: day_18_outro
    text: |
      Спасибо, что уделили время практике! Теперь у вас есть ценный инструмент для поддержания себя в трудные минуты. Попробуйте использовать его, когда сталкиваетесь с неприятными переживаниями.

      До встречи завтра!

  - id: day_19_info
    delay_minutes: 1  # production: 1440
    text: |
      Сила реалистичных ожиданий

      Представьте важный экзамен: можно надеяться на лучший результат, а можно дополнительно спросить себя: «Какие вопросы окажутся самыми сложными?»

      Второй вопрос не обязательно разрушает уверенность, ибо иногда он помогает понять, чему стоит уделить больше внимания.

      Защитный пессимизм — не отказ от успеха, а один из способов подготовки к нему.

      Сегодня мы предлагаем вам ещё раз посмотреть на практику “Список приятных и эффективных действий”, чтобы закрепить важный навык помощи себе в трудные минуты.
    file:
      - День 19.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_19_practice

  - id: day_19_practice
    text: |
      Список приятных и эффективных действий: руководство по применению

      Прочтите два сценария, которые представлены на карточках в приложенном файле. Затем подумайте о том, почему два одинаковых действия в итоге могли привести к разным последствиям?
    file:
      - День 19. Практика.mp3
      - День 19. Практика.pdf
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_19_outro

  - id: day_19_outro
    text: |
      Спасибо, что уделили время практике! В этих двух сценариях одно и то же действие – «слушать любимую музыку» – привело к совсем разным последствиям из-за разных намерений. Негативное намерение – Том использует музыку с целью избавиться от грусти и ухудшающегося настроения (это проявляется в том, что он все время проверяет, улучшилось ли настроение) – только усилило неприятные чувства.

      Позитивное доброе намерение – Джим использует музыку как способ позаботиться о себе, когда чувствует грусть и подавленность, – позволило исцелению произойти.

      Важно совершать приятные и эффективные действия с добротой к себе и намерением позаботиться о себе.

      До встречи завтра!

  - id: day_20_info
    delay_minutes: 1  # production: 1440
    text: |
      Осторожность и смелость

      Осторожность не всегда противоположна смелости: человек может испытывать тревогу перед сложной задачей, тщательно готовиться и всё равно решиться на действие.

      В этом случае тревога не исчезает полностью, но перестаёт быть непреодолимым препятствием.

      Сегодня мы предлагаем повторить любую из пройденных практик и помочь закрепить себе полезные навыки.
    file:
      - День 20.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_20_practice

  - id: day_20_practice
    text: |
      Повторение

      Найдите 10-20 свободных минут, чтобы посвятить их себе. Затем вспомните практику, которая больше всего пришлась по душе, и повторите её.
    file:
      - День 20. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_20_outro

  - id: day_20_outro
    text: |
      Спасибо, что уделили время практике! Позади – немалый ценный путь навстречу к себе. Все получится!

      До встречи завтра!

  - id: day_21_info
    delay_minutes: 1  # production: 1440
    text: |
      Беспокойство может стать планом

      На этой неделе мы познакомились с необычной идеей: иногда ожидание трудностей может помогать нам достигать целей. Предусмотрительность, подготовка и внимание к возможным ошибкам – потенциально полезные стороны такого подхода.

      Но есть важное условие: после тревожного прогноза должно появляться действие, а не только новое беспокойство.

      Сегодня мы предлагаем вам практику “Оставаться в настоящем” – она поможет научиться контролировать поток своих мыслей и прислушиваться к важным сигналам, выбирая при этом конструктивное действие.
    file:
      - День 21.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_21_practice

  - id: day_21_practice
    text: |
      Оставаться в настоящем

      Сегодня попробуем замечать, что происходит в теле во время обычных дел. Начните прямо сейчас, пока читаете это сообщение, и попробуйте делать это в течение 10 минут.

      В какой позе вы находитесь? Где чувствуете опору? Когда встанете, обратите внимание на то, как вес переносится на стопы и как вы выпрямляетесь. Обращайте также внимание на то, как тело двигается, как соприкасается с другими предметами. Подмечайте каждую деталь.

      Если внимание переключится на мысли или дела, мягко верните его к тому, что ощущаете прямо сейчас. Так вы сможете практиковать осознанность прямо посреди привычных дел.
    file:
      - День 21. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_21_outro

  - id: day_21_outro
    text: |
      Спасибо, что уделили время практике! Теперь в вашем багаже есть ценный инструмент по перенесению себя в настоящее.

      Поздравляем с завершением 3 недели практикума и просим пройти опрос для отслеживания прогресса с целью получения персонализированной обратной связи и участия в лотерее по итогам практикума.

      Нажмите на кнопку “Пройти опрос”
    buttons:
      - id: open_survey
        text: Пройти опрос
        action: open_survey
        event: survey_21

  - id: survey_21
    text: |
      Опрос третьей недели

      Опрос доступен по ссылке ниже. Важно: указывайте в опросе ту же почту, что вы указали при регистрации в боте.

      После завершения прохождения опроса нажмите на кнопку “Опрос пройден”
    buttons:
      - id: survey_link
        text: Открыть опрос
        url: https://forms.gle/u7vXdzNFyzP5JuwUA
      - id: survey_done
        text: Опрос пройден
        action: survey_done
        event: after_survey_21

  - id: after_survey_21
    text: |
      Спасибо за прохождение опроса. До встречи завтра!

  # ==========================================================================
  # НЕДЕЛЯ 4. Тревожность и позитивная эмоциональность
  # ==========================================================================

  - id: day_22_info
    delay_minutes: 1  # production: 1440
    text: |
      Чувствительность – это не только грусть

      Когда мы говорим об эмоционально чувствительном человеке, то чаще всего представляем тревогу, обиду или грусть.

      Но эмоциональная жизнь гораздо разнообразнее: человек может остро переживать неприятности и одновременно испытывать сильную радость, воодушевление или восторг.

      На этой неделе мы поговорим о том, что высокая чувствительность далеко не всегда предполагает только негатив – но ещё и позитив, способность ярче воспринимать хорошие вещи.

      Сегодня мы предлагаем вам практику “Взгляд вперед”, которая по отзывам прошлых участников помогает найти причину продолжать развивать полезные навыки.
    file:
      - День 22.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_22_practice

  - id: day_22_practice
    text: |
      Взгляд вперед

      Устройтесь поудобнее в расслабленном положении сидя, сделайте несколько осознанных вдохов и выдохов, чтобы собраться с мыслями, и, если вам так удобно, закройте глаза.

      Позвольте следующему вопросу мягко проникнуть в ваш разум и сердце и мягко сохраняться там осознанным:

      «Что является самым важным в моей жизни, что я больше всего ценю и чем может помочь мне практика?»

      Здесь имеется в виду практика осознанности в общем виде.

      Когда будете готовы, сделайте чуть более глубокий вдох и осторожно откройте глаза.
    file:
      - День 22. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_22_outro

  - id: day_22_outro
    text: |
      Спасибо, что уделили время практике! Если вы обнаружили причину, по которой надо практиковать осознанность, связанную с чем-то, что вам глубоко небезразлично, запишите ее, чтобы вы могли обратиться к ней, когда вам будет нужно, – чтобы напомнить себе о ней, еще раз вдохновиться и восстановить связь с глубинной причиной продолжать практику.

      До встречи завтра!

  - id: day_23_info
    delay_minutes: 1  # production: 1440
    text: |
      Радость тоже бывает сильной

      Представьте человека, который сильно волнуется перед важным событием. Но когда всё заканчивается хорошо, он испытывает огромное облегчение и радость.

      Эмоциональная чувствительность не обязательно ограничивается неприятными переживаниями – она предполагает также более яркое проживание радостных моментов.

      Сегодня мы предлагаем вам вновь повторить любую из понравившихся вам практик, чтобы закрепить полученные навыки.
    file:
      - День 23.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_23_practice

  - id: day_23_practice
    text: |
      Повторение

      Найдите сегодня свободное время для себя и, как будете готовы, начните практику.
    file:
      - День 23. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_23_outro

  - id: day_23_outro
    text: |
      Спасибо, что уделили время практике! Как вы себя чувствуете после нее? Удалось ли в этот раз обнаружить что-либо новое для себя?

  - id: day_24_info
    delay_minutes: 1  # production: 1440
    text: |
      Не только плохие эмоции

      Мы привыкли делить людей на тревожных и жизнерадостных. Но в действительности эти характеристики не обязательно являются противоположностями: человек может часто беспокоиться и при этом искренне радоваться встречам, увлекаться интересными занятиями и испытывать сильные положительные эмоции.

      Сегодня мы предлагаем вам практику “Мысли, которые мне мешают” – она поможет отследить блокирующие мысли и проработать их.
    file:
      - День 24.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_24_practice

  - id: day_24_practice
    text: |
      Мысли, которые мне мешают

      Найдите 10-20 минут свободного времени и уделите его себе. Запишите мысли, которые потенциально мешают вашим конструктивным изменениям и блокируют ваши более осознанные действия. На приложенной картинке представлены примеры подобных мыслей.
    file:
      - День 24. Практика.mp3
      - День 24. Практика.png
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_24_outro

  - id: day_24_outro
    text: |
      Спасибо, что уделили время практике! Теперь вы знаете мысли-блокаторы, которые могут мешать вашим изменениям. До встречи завтра!

  - id: day_25_info
    delay_minutes: 1  # production: 1440
    text: |
      Эмоциональная жизнь многогранна

      Вспомните день, когда вы сначала сильно волновались, а потом испытали радость или облегчение. За один день мы можем переживать множество совершенно разных эмоций.

      Высокая негативная эмоциональность не означает, что положительные переживания человеку недоступны – напротив, порой они бывают достаточно яркими.

      Сегодня мы хотели бы предложить вам практику “Незапланированная медитативная передышка”, которая эффективно помогает расслабиться и прийти к более осознанным действиям прямо в моменте.
    file:
      - День 25.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_25_practice

  - id: day_25_practice
    text: |
      Незапланированная медитативная передышка

      Данная практика полезна при столкновении с внезапным неприятным событием. Чтобы выполнить эту практику, достаточно лишь небольших действий, зато эффект от нее будет достаточно ощутимым.

      1. Сознательно примите удобную для себя позу.
      2. Узнайте и констатируйте свои текущие переживания: мысли, чувства, ощущения в теле.
      3. Соберите все внимание на вдохах и выдохах.
      4. Расширьте осознание на все тело в целом, а затем – на те переживания, что присутствуют у вас, посмотрев на приложенную картинку.
    file:
      - День 25. Практика.mp3
      - День 25.Практика.png
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_25_outro

  - id: day_25_outro
    text: |
      Спасибо, что уделили время практике! Теперь у вас есть ещё один ценный ресурс на случай столкновения с неприятными событиями.

      До встречи завтра!

  - id: day_26_info
    delay_minutes: 1  # production: 1440
    text: |
      Чувствовать – не значит быть слабым

      Иногда люди стыдятся своей эмоциональности.

      Им кажется, что нужно меньше переживать, спокойнее реагировать и никогда не показывать уязвимость.

      Но сама по себе способность испытывать сильные эмоции не делает человека слабым.

      Гораздо важнее, как он понимает свои переживания и что делает под их влиянием.

      Эмоциональная чувствительность — не повод относиться к себе хуже.

      Сегодня мы предлагаем повторить любую из полюбившихся вам практик.
    file:
      - День 26.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_26_practice

  - id: day_26_practice
    text: |
      Повторение

      Найдите свободное время для себя и повторите любую из практик этой недели, которая запомнилась вам больше всего. Подойдите к ней с любопытством – сегодня ваши ощущения могут быть другими.
    file:
      - День 26. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_26_outro

  - id: day_26_outro
    text: |
      Спасибо, что уделили время практике! До встречи завтра!

  - id: day_27_info
    delay_minutes: 1  # production: 1440
    text: |
      Не нужно отказываться от своей чувствительности

      Представьте, что у вас есть особенность, которая иногда создаёт трудности, но в других ситуациях оказывается полезной.

      Обязательно ли считать её недостатком?

      Тревожность действительно может сопровождаться неприятными переживаниями. Но чувствительность к угрозам, предусмотрительность и внимание к отношениям иногда имеют ценное значение и помогают нам.

      Сегодня мы предлагаем вам практику “Мой план действий”, которую мы будем выполнять два дня. Участники прошлых запусков отмечают положительный эффект такой практики, ведь она направлена на формирование собственного плана действий в трудных ситуациях.
    file:
      - День 27.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_27_practice

  - id: day_27_practice
    text: |
      Мой план действий: часть 1

      Сегодня мы подготовимся к заполнению собственного плана действий на случай трудных ситуаций, ответив на несколько важных вопросов. Пожалуйста, найдите 10-20 минут на себя и запишите ответы на вопросы, что представлены ниже.

      1. Что помогало вам в прошлом, когда вы начинали чувствовать себя плохо?
      2. Каким может быть адекватный ответ на душевную боль или плохое настроение? Как лучше всего отреагировать на хаос в мыслях и чувствах, не ухудшая положение (включая то, что вы узнали в ходе этого курса)?
      3. Как лучше всего позаботиться о себе в эти трудные и болезненные моменты (например, предметы, которые могли бы вас успокоить, действия, которые могли бы вас поддержать, люди, с которыми вы могли бы контактировать, чтобы мудро ответить на свой дистресс)?
      4. Какие препятствия в прошлом мешали вам предпринимать полезные действия, чтобы помочь себе, когда все начинало выходить из-под контроля? Как вы могли бы справиться с этими препятствиями, если они возникли бы в будущем?
    file:
      - День 27. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_27_outro

  - id: day_27_outro
    text: |
      Спасибо, что уделили время практике! Осознайте и обдумайте все написанное еще раз, а завтра мы продолжим выполнять эту практику. До встречи!

  - id: day_28_info
    delay_minutes: 1  # production: 1440
    text: |
      Посмотреть на себя по-новому

      За четыре недели мы познакомились с непривычной стороной нашей тревожности.

      Мы узнали, что эмоциональная чувствительность иногда помогает заботиться о здоровье, замечать напряжение в отношениях и готовиться к сложным ситуациям. Мы также увидели, что склонность к неприятным переживаниям не исключает положительных эмоций.

      Тревожность не становится исключительно полезным качеством, но и считать ее исключительно недостатком было бы слишком просто.

      Сегодня мы завершаем наш курс второй частью практики “Мой план действий”.
