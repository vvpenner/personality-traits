        text: Завершить практику
        action: finish_practice
        event: day_14_outro

  - id: day_14_outro
    text: |
      Спасибо за то, что уделили время практике. Поздравляем вас с завершением 2 недели практикума и просим пройти опрос для отслеживания прогресса с целью получения персонализированной обратной связи и участия в лотерее по итогам практикума.

      Нажмите на кнопку “Пройти опрос”
    buttons:
