# ============================================================================
# perkeys.yaml — сценарий Telegram-бота практикума LESSSTRESS
# («Периферийный ключ», 28 дней / 4 недели)
#
# Как устроен файл:
#   - Каждое событие: id, text, file (список вложений из DATA_DIR), buttons,
#     delay_minutes.
#   - delay_minutes у события — пауза ПЕРЕД его отправкой. Отсчёт идёт от
#     нажатия предыдущей кнопки или от отправки предыдущего сообщения.
#   - Событие без кнопок => бот автоматически планирует следующее по порядку
#     через delay_minutes следующего события.
#   - Кнопка с полем url открывает ссылку (без callback); кнопка с event
#     ведёт на событие сценария.
#
# !!! ТЕСТОВЫЙ РЕЖИМ: интервал между днями = 1 минута.
# !!! Для продакшена замените delay_minutes у всех day_*_info на 1440 (сутки),
# !!! а у posttest — на 43200 (30 дней).
#
# Имена медиафайлов (папка questionnaire/abfi-1/data/):
#   Титульная картинка.png    — картинка вступительного сообщения
#   День N.png                — картинка инфо-сообщения дня N (уже в репозитории)
#   День N. Практика.mp3      — аудио практики дня N (грузить по мере готовности;
#                               отсутствующие файлы пропускаются с warning в логах)
#   День N. Практика.pdf      — документ к практике (дни 1, 5, 7, 10, 11, 13, 19, 28)
#   День N. Практика.png      — картинка к практике (дни 2, 10, 24, 25; уже в репозитории)
# ============================================================================

messages:

  # --------------------------------------------------------------------------
  # Вступление
  # --------------------------------------------------------------------------
  - id: start
    text: |
      Дорогой участник, добро пожаловать на практикум LESSSTRESS! Этот практикум предлагает 20 техник, направленных на преодоление негативных психологических состояний. Эти техники не занимают много времени, поэтому их удобно практиковать в течение дня. При этом предложенные практики доказали свою эффективность: они проверены многочисленными научными исследованиями, а 90% участников прошлых запусков отметили снижение общего уровня стресса и тревоги.

      Практикум рассчитан на месяц – именно столько нужно, чтобы закрепить новые способы поведения. Пожалуйста, выполните предложенные вам задания – они точно покажут свой эффект!

      По всем вопросам вы можете обращаться к @vv_penner. Приятного вам путешествия в мир осознанности!
    file:
      - Титульная картинка.png
    buttons:
      - id: start_course
        text: Начать курс
        action: start_course
        event: day_1_info

  # ==========================================================================
  # НЕДЕЛЯ 1. Нейротизм и забота о здоровье
  # ==========================================================================

  - id: day_1_info
    delay_minutes: 0  # первое сообщение дня 1 — сразу после нажатия «Начать курс»; production: 1440
    text: |
      Тревога бывает полезной

      Мы привыкли думать, что тревожность – это недостаток. Но что, если иногда она помогает нам?

      Представьте сигнализацию, которая предупреждает об опасности еще до того, как случилось что-то плохое. Наша эмоциональная чувствительность может работать похожим образом.

      Люди с высокой тревожностью нередко раньше замечают возможные неприятности. И иногда именно это позволяет вовремя принять меры.

      Возможно, ваша чувствительность — не только уязвимость, но и полезный сигнал.
    file:
      - День 1.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_1_practice

  - id: day_1_practice
    text: |
      Ешьте изюм осознанно

      Сегодня мы предлагаем вам нашу первую практику – “Ешьте изюм осознанно”. Она поможет научиться прислушиваться к своим ощущениям в моменте. Многие исследователи и участники признают эту практику особенно эффективной.

      Вам понадобится несколько изюминок (или чего угодно!) для этой практики на осознанное присутствие в моменте. Сядьте удобно там, где есть хорошее освещение и вас не будут беспокоить. Затем медленно настройте себя на прохождение практики.

      Желаем вам приятного путешествия!

      p.s. Для вашего удобства мы предлагаем два формата: аудио- и текстовый формат (текст практики — в приложенном файле).
    file:
      - День 1. Практика.mp3
      - День 1. Практика.pdf
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_1_outro

  - id: day_1_outro
    text: |
      Поздравляем вас с прохождением первой практики! Как вы оцениваете этот опыт? Что вы ощущали? Чем этот опыт отличается от обычного опыта еды?

      Для закрепления навыка предлагаем вам проделывать это в течение нескольких ближайших дней

  - id: day_2_info
    delay_minutes: 1  # production: 1440
    text: |
      Внимание к себе

      Вы когда-нибудь замечали небольшое изменение самочувствия, которое другие могли бы проигнорировать? Некоторые люди особенно внимательно прислушиваются к своему организму. Они замечают усталость, дискомфорт и необычные ощущения. Такая внимательность иногда помогает раньше обратиться за помощью или задуматься о собственном здоровье – это ещё одна положительная сторона нашей тревожности.

      Сегодня мы хотим предложить вам практику привнесения осознанности в повседневные дела. Такие практики отлично помогают обращать внимание на сигналы и анализировать их.
    file:
      - День 2.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_2_practice

  - id: day_2_practice
    text: |
      Осознанность в повседневных делах

      Выберите одно действие, которое выполняете каждый день, и попробуйте сегодня привнести в это действие осознанность. Например, вы можете выбрать действия из этого списка.
    file:
      - День 2. Практика.mp3
      - День 2. Практика.png
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_2_outro

  - id: day_2_outro
    text: |
      Как вы себя чувствуете после практики? Осознайте свои ощущения, проанализируйте их, закрепите этот опыт повторением практики. Также вы можете ознакомиться с отзывами других участников (картинка ниже). До встречи!
    file:
      - День 2. Отзывы к заданию 2.png

  - id: day_3_info
    delay_minutes: 1  # production: 1440
    text: |
      Беспокойство, которое побуждает действовать

      Представьте двух людей, которые замечают необычный симптом. Один решает не обращать внимание, а другой – записывается к врачу, и это помогает ему на раннем этапе решить проблему.

      Иногда беспокойство становится стимулом к полезному действию.

      Конечно, не каждая тревога указывает на реальную опасность. Но когда за вниманием к себе следуют разумные действия, ранний тревожный сигнал может оказаться преимуществом!

      Сегодня мы предлагаем вам повторить любую из пройденных практик. Повторение – залог закрепления новых способов поведения. У вас все получится!
    file:
      - День 3.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_3_practice

  - id: day_3_practice
    text: |
      Повторение

      Выберите любую из уже знакомых практик – «Ешьте изюм осознанно» или осознанность в повседневных делах – и повторите её сегодня. Повторение – залог закрепления новых способов поведения. У вас всё получится!
    file:
      - День 3. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_3_outro

  - id: day_3_outro
    text: |
      Спасибо, что уделили время практике! До встречи завтра!

  - id: day_4_info
    delay_minutes: 1  # production: 1440
    text: |
      Неожиданный союз

      А вы знали, что тревожность и организованность иногда могут дополнять друг друга?

      Один человек замечает возможную проблему, а другой умеет последовательно её решать. Но ведь обе эти способности могут сочетаться и в одном человеке!

      В некоторых исследованиях сочетание тревожности и организованности делало поведение человека более эффективным в контексте решения проблем.

      Для развития навыка организованной реакции на тревожный сигнал сегодня мы предлагаем вам практику “Другой способ познания”. Участники прошлых запусков подтверждают, что она помогает не увязнуть в негативных мыслях и предпринять организованное действие.
    file:
      - День 4.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_4_practice

  - id: day_4_practice
    text: |
      Другой способ познания

      Попробуйте сегодня в момент, когда приходит тяжелая мысль или чувство, вместо того чтобы вовлекаться в историю («опять всё плохо», «я не справлюсь»), просто перевести внимание на тело. Где живет это чувство? Тяжесть в груди? Сжатие в животе? Просто почувствуйте это ощущение. Без названия, без оценки, без желания, чтобы оно ушло.

      В этом пространстве между стимулом и реакцией рождается свобода. Вы перестаете быть жертвой своих мыслей и становитесь свидетелем своей жизни. Вы узнаете, что вы – это не ваши мысли, вы – это то пространство, в котором они появляются и исчезают.
    file:
      - День 4. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_4_outro

  - id: day_4_outro
    text: |
      Поздравляем с завершением практики! Что вы заметили в процессе её прохождения? Удалось ли вам с помощью этой практики выбрать более эффективную реакцию на сигнал тревоги?

      До встречи завтра!

  - id: day_5_info
    delay_minutes: 1  # production: 1440
    text: |
      Маленькие шаги имеют значение

      Забота о здоровье не всегда начинается с больших решений.

      Иногда всё начинается с простого: заметить усталость, выделить время для отдыха, записаться на обследование или пересмотреть привычку.

      Повышенная чувствительность к возможному неблагополучию может стать напоминанием о том, что собственное здоровье заслуживает внимания.

      Сегодня мы хотим предложить вам практику, которая помогает замечать сигналы своего тела и разума прямо в моменте – 10-минутную медитацию осознанности.
    file:
      - День 5.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_5_practice

  - id: day_5_practice
    text: |
      10 минут внимания к себе

      В этой практике мы будем замечать дыхание и ощущения в теле, возвращая внимание к настоящему моменту. Не нужно дышать особым образом или стараться остановить мысли. Если отвлечетесь, просто мягко верните внимание к дыханию – это и есть часть практики.

      Устройтесь поудобнее и выделите 10 минут, в течение которых сможете побыть с собой!

      p.s. Для вашего удобства мы предлагаем аудио- и текстовый формат (текст медитации — в приложенном файле).
    file:
      - День 5. Практика.mp3
      - День 5. Практика.pdf
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_5_outro

  - id: day_5_outro
    text: |
      Как вы чувствуете себя после практики? Что вы заметили в своих ощущениях, мыслях или эмоциях? Любой опыт ценен – даже если кажется, что ничего не изменилось.

      Спасибо, что уделили время практике. До встречи завтра!

  - id: day_6_info
    delay_minutes: 1  # production: 1440
    text: |
      Сигнал – не приговор

      Представьте пожарную сигнализацию. Иногда она срабатывает из-за настоящей опасности, а иногда – из-за подгоревшего тоста. Но мы не считаем саму способность предупреждать об угрозе бесполезной.

      Похожим образом можно относиться и к тревожности: не каждый сигнал означает беду, но некоторые сигналы действительно заслуживают внимания.

      Сегодня мы повторим одну из уже знакомых практик. Повторение помогает осваивать новый навык.
    file:
      - День 6.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_6_practice

  - id: day_6_practice
    text: |
      Повторение

      Даже если инструкция та же, ваши мысли, ощущения и эмоции сегодня могут быть другими. Попробуйте подойти к практике с любопытством, без требования получить от нее определенный результат.

      Выберите знакомую практику – и начнем!
    file:
      - День 6. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_6_outro

  - id: day_6_outro
    text: |
      Спасибо, что уделили время практике! Удалось ли вам ощутить что-то новое?

      До встречи завтра!

  - id: day_7_info
    delay_minutes: 1  # production: 1440
    text: |
      Ваша тревожность может быть ресурсом

      За эту неделю мы посмотрели на тревожность с непривычной стороны.

      Внимание к изменениям, готовность замечать риски, желание позаботиться о себе – все это может быть следствием полезной тревожности. Она не всегда помогает и не заменяет разумных решений. Но её совсем не обязательно считать исключительно недостатком – порой она выступает для нас верным помощником.

      Сегодня мы предлагаем вам 3-минутную медитативную передышку, которая эффективно помогает перезагрузиться и прислушаться к собственным ощущениям в моменте.
    file:
      - День 7.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_7_practice

  - id: day_7_practice
    text: |
      Трехминутная медитативная передышка

      Сядьте в удобное место, займите комфортную для вас позу и настройтесь на практику. Голос поведет вас за собой. Приятного путешествия!

      p.s. Для вашего удобства мы предлагаем аудио- и текстовый формат (текст медитации — в приложенном файле).
    file:
      - День 7. Практика.mp3
      - День 7. Практика.pdf
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_7_outro

  - id: day_7_outro
    text: |
      Спасибо, что уделили время практике! Как вы себя чувствуете после нее? Что нового заметили в своем состоянии?

      Поздравляем вас с завершением первой недели нашего практикума! Пожалуйста, пройдите этот короткий опрос, который займет у вас всего минуту – он поможет нам контролировать качество нашего практикума :)

      Нажмите на кнопку “Пройти опрос”
    buttons:
      - id: open_survey
        text: Пройти опрос
        action: open_survey
        event: survey_7

  - id: survey_7
    text: |
      Опрос первой недели

      Пожалуйста, пройдите короткий опрос по ссылке ниже – он займет всего минуту. Важно: указывайте в опросе ту же почту, что вы указали при регистрации в боте.

      По завершении опроса нажмите на кнопку “Опрос пройден”
    buttons:
      - id: survey_link
        text: Открыть опрос
        url: https://forms.gle/FKoEF1sDKDiWDSLfA
      - id: survey_done
        text: Опрос пройден
        action: survey_done
        event: after_survey_7

  - id: after_survey_7
    text: |
      Спасибо, что прошли опрос! Продолжаем развивать навык осознанного отношения к собственной тревожности.

      До встречи завтра!

  # ==========================================================================
  # НЕДЕЛЯ 2. Тревожность и социальные конфликты
  # ==========================================================================

  - id: day_8_info
    delay_minutes: 1  # production: 1440
    text: |
      Чувствовать больше – замечать больше

      Поздравляем вас с началом второй недели нашего практикума! На этой неделе мы рассмотрим позитивную роль тревожности в социальных конфликтах.

      Бывало ли у вас ощущение, что в разговоре что-то изменилось, хотя собеседник ничего не сказал прямо? Интонация стала холоднее, появилась напряженная пауза, выражение лица изменилось… Эмоционально чувствительные люди могут быть особенно внимательны к подобным сигналам, и порой это помогает нам быстрее заметить проблему в коммуникации и решить её.

      Сегодня мы предлагаем вам практику “Встреча на улице”, которая эффективно помогает научиться идентифицировать наши мысли и чувства и отделять их от фактов, а значит – реагировать на ситуации более осознанно.
    file:
      - День 8.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_8_practice

  - id: day_8_practice
    text: |
      Встреча на улице

      Сядьте в удобное положение. Когда будете готовы, прочитайте описанную ниже ситуацию. Сосредоточьтесь на минуту или две, чтобы представить себе ситуацию как можно ярче. Возможно, для этого вам потребуется закрыть глаза. Не торопитесь. Попытайтесь полностью перенестись в воображаемую сцену.

      Вы идете по знакомой улице. На противоположной стороне вы видите человека, которого знаете. Вы улыбаетесь и машете. Человек никак не реагирует, похоже, просто не замечает вас. Проходит мимо без каких-то признаков, что признаёт ваше существование. Представьте себе эту ситуацию сейчас.

      Далее подумайте (если удобно – запишите), какие мысли и чувства возникли у вас сейчас?
    file:
      - День 8. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_8_outro

  - id: day_8_outro
    text: |
      Спасибо, что уделили время практике! Одна и та же ситуация может вызвать широкий спектр мыслей и интерпретаций, и именно они, а не сама ситуация, определяют то, что мы чувствуем:

      – если мы думаем, что кто-то игнорирует нас, потому что мы сделали что-то не то, мы расстроены;
      – если мы думаем, что кто-то намеренно игнорирует нас, мы злимся;
      – если мы думаем, что человек озабочен своими собственными проблемами, мы чувствуем беспокойство, и так далее.

      Но, главное, часто мы не осознаём собственные интерпретации ситуаций. Осознанность помогает нам стать более сосредоточенными и дает свободу реагировать по-другому.

      До встречи завтра!

  - id: day_9_info
    delay_minutes: 1  # production: 1440
    text: |
      Конфликт начинается не с ссоры

      Не каждый конфликт начинается с громких слов: иногда всё начинается с маленького недоразумения, невысказанного недовольства или изменения поведения.

      Способность рано замечать напряжение помогает нам вовремя обратить внимание на отношения. Конечно, не каждый замеченный сигнал означает реальный конфликт, но если тревога сработала корректно – это отличный шанс предотвратить возможные проблемы.
    file:
      - День 9.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_9_practice

  - id: day_9_practice
    text: |
      Повторение

      Когда вам сегодня было бы удобно сделать паузу? Может быть, в обеденный перерыв, после работы или перед вечерними делами?

      Выберите любую из уже знакомых нам практик и попробуйте повторить её в этот момент. Повторение – залог успешного закрепления нового навыка. Желаем вам приятной практики!
    file:
      - День 9. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_9_outro

  - id: day_9_outro
    text: |
      Спасибо за то, что уделили время практике! Подумайте о том, какие изменения вы заметили за эти полторы недели практикума – какие они, как вы к ним относитесь?

      До встречи завтра!

  - id: day_10_info
    delay_minutes: 1  # production: 1440
    text: |
      Гнев тоже о чем-то сообщает

      Привет, дорогой участник! Сегодня мы поговорим о гневе.

      Гнев принято считать неприятной эмоцией. Но иногда он появляется тогда, когда человек чувствует, что его границы нарушены. Представьте, что ваши усилия постоянно обесценивают или ваши интересы игнорируют – в таком случае раздражение может стать важным сигналом: «Для меня это важно».

      Сегодня мы предлагаем вам практику “Календарь неприятных переживаний”, которая помогает зафиксировать ощущаемый нами негатив, разложить его на составляющие и понять тот сигнал, который он нам подает.
    file:
      - День 10.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_10_practice

  - id: day_10_practice
    text: |
      Календарь неприятных переживаний

      Используйте вопросы из приложенного файла, чтобы сосредоточить свое осознание на деталях переживания, когда оно происходит. После заполните таблицу по примеру.
    file:
      - День 10. Практика.mp3
      - День 10. Практика.png
      - День 10. Практика.pdf
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_10_outro

  - id: day_10_outro
    text: |
      Спасибо, что уделили время практике!

      Как вы себя чувствуете? Удалось ли вам по-новому взглянуть на свои переживания?

  - id: day_11_info
    delay_minutes: 1  # production: 1440
    text: |
      Чувствовать и выбирать

      Представьте человека, который сильно раздражён, но вместо ссоры спокойно говорит: «Мне неприятно, когда со мной так поступают». Его эмоция не исчезла, но он нашёл способ выразить её конструктивно.

      В этом и заключается важное различие: чувствовать гнев и действовать агрессивно — не одно и то же.

      Сегодня мы предлагаем вам практику “Контрольный список негативных мыслей”. Психологи подтверждают, что эта практика помогает заметить, как меняется наше отношение к одним и тем же мыслям в разных состояниях, и научиться контролировать его.
    file:
      - День 11.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_11_practice

  - id: day_11_practice
    text: |
      Контрольный список негативных мыслей

      Вспомните период, когда вы переживали тяжелые состояния. В таблице из приложенного файла собраны мысли, которые могли возникнуть тогда – отметьте в столбце А те, что возникли у вас.

      Далее оцените, насколько вы верили в каждую из них в пик тяжелого состояния — от 0 («не верил(а) вообще») до 10 («верил(а) полностью») в столбце Б.

      Теперь вспомните время, когда вам было хорошо. Пересмотрите те же мысли и поставьте оценки от 0 до 10 в столбце В — насколько вы в них верили, будучи в спокойном состоянии.
    file:
      - День 11. Практика.mp3
      - День 11. Практика.pdf
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_11_outro

  - id: day_11_outro
    text: |
      Спасибо, что уделили время практике! Получилось ли извлечь из нее что-то новое для себя? Каков этот опыт?

      До встречи завтра!

  - id: day_12_info
    delay_minutes: 1  # production: 1440
    text: |
      Внимание к другим

      Иногда чувствительность к напряжению помогает лучше замечать переживания окружающих: человек может быстрее обратить внимание на то, что собеседник расстроен, обеспокоен или нуждается в поддержке.

      Это не означает, что тревожные люди всегда лучше понимают других. Но эмоциональная чувствительность порой создаёт ценные дополнительные возможности для внимательного общения с другими.

      Сегодня мы предлагаем повторить любую уже знакомую вам практику.
    file:
      - День 12.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_12_practice

  - id: day_12_practice
    text: |
      Повторение

      Найдите свободное время, в которое вы сможете не отвлекаться, выберите любую больше всего запомнившуюся вам практику и повторите её. Участники прошлых запусков отмечают особую эффективность повторения понравившихся практик.

      Желаем вам приятного путешествия!
    file:
      - День 12. Практика.mp3
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_12_outro

  - id: day_12_outro
    text: |
      Спасибо, что уделили время практике! Как вы себя чувствуете? Удалось ли заметить во время практики что-то новое?

  - id: day_13_info
    delay_minutes: 1  # production: 1440
    text: |
      Неожиданная сторона нашей тревожности

      Кажется логичным, что эмоциональная чувствительность должна только осложнять отношения. Однако многочисленные исследования показывают более интересную картину: при определённых условиях наша тревожность может сочетаться с конструктивными способами разрешения конфликтов. Особенно важна способность не просто замечать напряжение, но и выбирать, как на него ответить.

      Сегодня мы предлагаем вам практику “Работа над проблемами”, которая эффективно помогает развить навык осознанного проживания негативных переживаний.
    file:
      - День 13.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_13_practice

  - id: day_13_practice
    text: |
      Работа над проблемами

      Настройтесь на приятную практику и начните в момент, когда будете готовы. Желаем вам приятного путешествия!

      p.s. Для вашего удобства предлагаем аудио- и текстовый формат (текст практики — в приложенном файле).
    file:
      - День 13. Практика.mp3
      - День 13. Практика.pdf
    buttons:
      - id: finish_practice
        text: Завершить практику
        action: finish_practice
        event: day_13_outro

  - id: day_13_outro
    text: |
      Спасибо, что уделили время практике! Удалось ли вам извлечь из нее что-то новое?

      До встречи завтра!

  - id: day_14_info
    delay_minutes: 1  # production: 1440
    text: |
      Чувствительность в отношениях

      На этой неделе мы увидели, что неприятные эмоции могут выполнять важные функции.

      Раздражение иногда сигнализирует о нарушении границ, беспокойство – о напряжении в отношениях, чувствительность – помогает заметить перемены. Важно не считать каждый эмоциональный сигнал истиной, а использовать его как повод внимательнее посмотреть на ситуацию.

      Сегодня мы предлагаем повторить любую из уже знакомых практик, чтобы закрепить полученные навыки.
    file:
      - День 14.png
    buttons:
      - id: begin_practice
        text: Начать практику
        action: begin_practice
        event: day_14_practice

  - id: day_14_practice
    text: |
      Повторение

      Какая из прошлых практик вам запомнилась? Может быть, одна вас удивила, а другую захотелось попробовать ещё раз.

      Сегодня выберите любую из них и повторите. После упражнения можно спросить себя: «Что мне подходит в этой практике?» Так постепенно у вас появится свой набор упражнений, к которым захочется возвращаться.
    file:
      - День 14. Практика.mp3
    buttons:
