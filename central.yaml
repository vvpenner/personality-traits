- id: day_7_info
  delay_seconds: 1
  text: "<b>Ваша тревожность может быть ресурсом</b>\n\nТревожность может становиться ресурсом, когда внимание к возможной проблеме помогает человеку предпринять полезные действия.\n\nВ программе повышения физической активности участники с сочетанием более высокого нейротизма и высокой добросовестности сильнее увеличивали число ежедневных шагов (Stieger et al., 2020). В другом исследовании такое же сочетание черт было связано с меньшей вероятностью курения после постановки диагноза серьёзного хронического заболевания (Weston & Jackson, 2015). Эти результаты согласуются с предположением, что обеспокоенность своим состоянием может поддерживать изменения привычек, когда сочетается с организованностью и готовностью действовать.\n\nСегодня мы предлагаем вам 3-минутную медитативную передышку – короткую остановку, чтобы заметить своё состояние и собрать внимание.\n"
  file:
