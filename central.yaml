- id: day_24_practice
  text: "<b>Мысли, которые мне мешают </b>\n\nСегодняшнее упражнение – тренировка навыка децентрации: после курса MBCT эта способность росла (Bieling et al., 2012), а у людей с депрессией в анамнезе она предсказывала меньший риск рецидива (Teasdale et al., 2002).\n\nНайдите 10-20 минут свободного времени и уделите его себе. Запишите мысли, которые потенциально мешают вашим конструктивным изменениям и блокируют ваши более осознанные действия. На картинке представлены примеры подобных мыслей. Обдумайте их и поразмышляйте, как именно они вам мешают и почему они у вас есть. \n"
  file:
  - ЦК_День 24. Практика.png
