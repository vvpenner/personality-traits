- id: day_8_practice
  text: "<b>Встреча на улице </b>\n\nПрактика знакомит с навыком децентрации – способностью замечать мысли как возникающие в сознании предположения, которые можно рассматривать и проверять. Возможность тренировать этот навык изучали Feldman и соавторы (2010). В эксперименте 190 участниц случайным образом распределили между тремя пятнадцатиминутными упражнениями: осознанным дыханием, мышечной релаксацией и медитацией доброжелательности. После осознанного дыхания участницы сообщали о более выраженной децентрации, чем после двух других упражнений. Это поддерживает идею, что отношение к собственным мыслям можно менять через практику внимания.\n\nСядьте в удобное положение. Когда будете готовы, прочитайте описанную ниже ситуацию.Сосредоточьтесь на минуту или две, чтобы представить себе ситуацию как можно ярче. Возможно, для этого вам потребуется закрыть глаза. Не торопитесь. Попытайтесь полностью перенестись в воображаемую сцену.\n\nВы идете по знакомой улице. На противоположной стороне вы видите человека, которого знаете. Вы улыбаетесь и машете. Человек никак не реагирует, похоже, просто не замечает вас. Проходит мимо без каких-то признаков, что признаёт ваше существование. Представьте себе эту ситуацию сейчас. \n\nДалее подумайте (если удобно – запишите), какие мысли и чувства возникли у вас сейчас? \n"
  file: []
