- id: day_13_practice
  text: "<b>Работа над проблемами </b>\n\nЗадача практики – не в том, чтобы ощущение прошло или проблема решилась, а в том, чтобы научиться присутствовать рядом с неприятным, не борясь с ним и не уходя в размышления. В исследованиях полного курса MBCT способность оставаться в контакте с трудным опытом рассматривалась как один из возможных механизмов действия программы (Kuyken et al., 2010). \n\nНастройтесь на приятную практику и начните в момент, когда будете готовы. Желаем вам приятного путешествия! \n\np.s. Для вашего удобства предлагаем аудио- и текстовый формат. \n"
