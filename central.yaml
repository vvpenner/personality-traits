  text: "<b>Повторение </b>\n\nВ рандомизированном исследовании Carson и соавторов (2004) было показано, что больший объём самостоятельной практики был связан с более благоприятными результатами развития новых навыков осознанности. \n\nКогда вам сегодня было бы удобно сделать паузу? Может быть, в обеденный перерыв, после работы или перед вечерними делами? Выберите любую из уже знакомых нам практик и попробуйте повторить её в этот момент. Желаем вам приятной практики!\n"
