- id: day_15_info
  delay_seconds: 1
  text: "<b>А что, если все пойдет не так?</b>\n\nПоздравляем с началом третьей недели нашего практикума! Эта неделя будет посвящена «защитному пессимизму». Термин «защитный пессимизм» предложили психологи Джули Норем и Нэнси Кантор (Norem & Cantor, 1986). Они описали группу людей, которые успешно справляются с учёбой и работой, но готовятся к делу особым образом: заранее ставят себе низкие ожидания («скорее всего, не получится»), а затем подробно прокручивают в голове, что именно может пойти не так. Такая «репетиция неудачи» не парализует их, а наоборот: беспокойство превращается в топливо подготовки.  Защитный пессимизм чаще встречается у людей с повышенной тревожностью – одной из составляющих нейротизма.\n\nЧто это рабочая стратегия, а не просто привычка думать о себе плохо, показывает эксперимент: когда защитным пессимистам мешали использовать привычный ход, они выполняли задание хуже (Norem & Cantor, 1986). Низкое ожидание и низкая способность — разные вещи: перед знакомым выступлением человек может предполагать, что собьётся, и заранее продумать, как вернуться к основной мысли. Уместность такого прогноза зависит от того, меняет ли он подготовку.\n\nВажная оговорка: эти данные не означают, что пессимизм полезен всем. В тех же исследованиях была группа «стратегических оптимистов», которые справлялись лучше, когда не репетировали неудачи (Norem & Illingworth, 1993). Вывод касается соответствия стратегии привычному стилю человека, а не пользы пессимизма как такового.\n\nСегодня мы предлагаем вам практику «Офис», в которой можно понаблюдать, как состояние влияет на наши мысли о происходящем.\n"
