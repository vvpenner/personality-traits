- id: day_23_outro
  text: |
    Спасибо, что уделили время практике! Как вы себя чувствуете после нее? Удалось ли в этот раз обнаружить что-либо новое для себя?

    До встречи завтра!
- id: day_24_info
  delay_seconds: 1
  text: |
    <b>Не только плохие эмоции </b>

    О нейротизме принято говорить как о слабости: мол, это склонность к тревоге, перепадам настроения, тяжёлым переживаниям. Мы предлагаем посмотреть точнее. Нейротизм – это прежде всего чувствительность эмоциональной системы: быстрый и сильный отклик на то, что происходит вокруг и внутри. Да, такая система остро реагирует на угрозы. Но та же чувствительность – это и богатство эмоциональной жизни: глубина переживаний, внимательность к переменам и рискам, умение тонко чувствовать то, что другие пропускают. Мы уже видели это на прошлых неделях: привычка замечать опасности может превращаться в тщательную подготовку, а тревога перед важным делом – в топливо для него

    Здоровый нейротизм – это не попытка уменьшить свою чувствительность, а умение пользоваться ею целиком: замечать не только опасности, но и возможности; проживать не только трудное, но и приятное – так же сильно.

    Сегодня мы предлагаем вам практику «Мысли, которые мне мешают».
  file:
