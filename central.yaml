- id: day_15_outro
  text: "Спасибо, что уделили время практике! Отличались ли ваши мысли в зависимости от ситуации? Как думаете, почему? \n\nОщущение убедительности мысли может меняться вместе с состоянием. Чтобы оценить само предположение, важно отдельно посмотреть, какие наблюдения его поддерживают и какие допускают другое объяснение.\n\nДо встречи завтра!\n"
- id: day_16_info
  delay_seconds: 1
  text: "<b>План Б – тоже хороший план</b>\n\nКак стратегия защитного пессимизма связана с запасным планом? \n\nВ одном исследовании (Norem & Illingworth, 1993) участники с разными привычными стратегиями – защитные пессимисты и стратегические оптимисты – перед заданием попадали в одно из двух условий: их либо просили обдумать предстоящую задачу (свои чувства и возможные исходы), либо отвлекали от неё. Условия сработали противоположно для двух групп: защитные пессимисты справлялись лучше после обдумывания задачи, а стратегические оптимисты — после отвлечения. Другими словами, один и тот же способ настроиться помогал одним и мешал другим – эффект зависел от соответствия привычной стратегии, а не от того, «полезно» или «вредно» думать о трудностях вообще.\n\nСледующий вопрос: как обдумывание может переходить в подготовку, а не в бесплодное беспокойство? Ответ дает работа Питера Голльвицера о планах в формате «если – то» (implementation intentions): план вида «если наступит ситуация X, я сделаю Y» заранее связывает препятствие с конкретным ответом. Метаанализ 94 исследований показал, что такие планы заметно повышают шансы довести намерение до конца (d = 0,65; Gollwitzer & Sheeran, 2006).\n\nОтсюда практическое различие: «может случиться что угодно» — это не план, а открытый список, который каждое новое опасение расширяет, не улучшая подготовку. «Если презентация не откроется, у меня будет копия» – уже конкретный план: в нём известны и условие, и ответ. Запасной вариант полезен в той мере, в какой он делает действие доступным.\n\nСегодня мы предлагаем вам практику «Поезд ассоциаций», которая помогает потренировать особый взгляд на мысли: не как на часть себя или точное описание реальности, а как на события, которые возникают и проходят. Это умение называют метакогнитивной осознанностью, или децентрацией.\n"
