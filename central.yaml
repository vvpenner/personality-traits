- id: day_22_info
  delay_seconds: 1
  text: "<b>Чувствительность – это не только грусть</b>\n\nПоздравляем с началом четвертой недели практикума! На этой неделе мы рассмотрим позитивную эмоциональность. \n\nО высоком нейротизме часто думают как о склонности к ярким неприятным переживаниям. Но эмоциональная чувствительность – это прежде всего сила переживания как такового, и она не обязана ограничиваться только трудными эмоциями: та же восприимчивость может работать и в положительную сторону. \n\nТакая возможность согласуется с данными исследований. При разработке шкал PANAS Дэвид Уотсон, Ли Анна Кларк и Ок Теллеген обнаружили, что позитивный и негативный аффект образуют относительно самостоятельные измерения: высокий балл по одному из них даёт лишь ограниченную информацию о балле по другому (Watson et al., 1988). Иными словами, склонность часто тревожиться ничего не отнимает у способности ярко радоваться – эти две черты живут каждая сама по себе. Два человека с одинаково высокой тревожностью могут сильно различаться по вовлечённости в приятные переживания, но это пространство выбора, а не приговор. Из самостоятельности шкал не следует, что высокий нейротизм сам по себе усиливает радость: он её совсем не исключает, а дальше многое решают наши привычки и внимание к приятному.\n\nСегодня мы предлагаем вам практику «Взгляд вперед», которая помогает сфокусировать внимание на собственных ценностях и прожить их, испытав приятные эмоции. \n"
  file:
  - ЦК_День 22.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_22_practice
- id: day_22_practice
  text: "<b>Взгляд вперед </b>\n\nУстройтесь поудобнее в расслабленном положении сидя, сделайте несколько осознанных вдохов и выдохов, чтобы собраться с мыслями, и, если вам так удобно, закройте глаза.\n\nПозвольте следующему вопросу мягко проникнуть в ваш разум и сердце и мягко сохраняться там осознанным:\n\n« Что является самым важным в моей жизни, что я больше всего ценю и чем может помочь мне практика?»\n\nЗдесь имеется в виду практика осознанности в общем виде. \n\nКогда будете готовы, сделайте чуть более глубокий вдох и осторожно откройте\n\nглаза.\n"
  file: []
