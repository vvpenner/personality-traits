- id: day_14_info
  delay_seconds: 1
  text: "<b>Чувствительность в отношениях </b>\n\nВ одном исследовании участники вели с партнёром переговоры о цене. В первой части проверяли простую вещь: если партнёр показывает гнев («мне не нравится ваше предложение, это возмутительно»), уступают ли ему больше? Да: гнев работал как сигнал «я на пределе, дальше торговаться не о чем», и люди снижали свои требования. \n\nПотом исследователи добавили важную деталь: у одной стороны торга появилась скрытая информация – только она знала настоящую ценность предмета, и партнёр не мог это проверить. То есть у неё появился скрытый ход: можно соврать о ценности и никто не узнает.И вот что вышло: когда партнёр гневался, люди на виду уступали – соглашались на его условия, – а потом чаще использовали свой скрытый ход: искажали информацию о ценности, то есть незаметно отыгрывали обратно то, что уступили (Van Dijk et al., 2008).\n\nИз этих данных не следует, что гнев – плохая стратегия, напротив, он приносил реальную пользу: видя гнев, партнёр понимал, что дальше давить некуда, и пересматривал своё предложение. Гнев сообщает собеседнику, что ваши интересы нарушены настолько, что вы готовы их отстаивать, – и иногда это единственный способ быть услышанным. Вопрос не в том, «хорош» гнев или «плох», а в условиях его применения: он работает, когда ответ собеседника открыт и виден, и дорого обходится, когда у того остаются скрытые ходы, а отношения вам важны.\n\nСегодня мы предлагаем повторить любую из уже знакомых практик. Значение самостоятельных занятий изучалось в отдельном исследовании: у 174 участников восьминедельного курса осознанности те, кто уделял домашней практике больше времени, показали больший рост осознанности и психологического благополучия к концу курса (Carmody & Baer, 2008).\n"
