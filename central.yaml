- id: day_4_outro
  text: "Поздравляем с завершением практики! Спасибо, что уделили ей время. Что вы заметили в процессе её прохождения? Удалось ли вам с помощью этой практики выбрать более эффективную реакцию на сигнал тревоги? \n\nМежду стимулом и реакцией появляется пауза: мысль можно заметить как мысль – и выбрать, следовать ли за ней. Именно в этой паузе тренируется другой способ познания.\n\nДо встречи завтра!\n"
- id: day_5_info
  delay_seconds: 1
  text: "<b>Маленькие шаги имеют значение</b>\n\nВновь обсудим положительное сочетание нейротизма и добросовестности. \n\nВ исследовании Stieger и соавторов (2020) 52 взрослых участвовали в программе повышения физической активности: в течение пяти недель они носили шагомеры, а после первой недели начали получать ежедневные напоминания о необходимости больше двигаться. У участников с сочетанием более высокого нейротизма и высокой добросовестности число шагов увеличивалось сильнее. \n\nЭтот результат согласуется с представлением о «здоровом нейротизме»: обеспокоенность своим состоянием может побуждать человека уделять здоровью больше внимания, а организованность – помогать воплощать намерения в действия.\n\nСегодня мы предлагаем потренировать навык внимательного отношения к своему состоянию с помощью 10-минутной медитации осознанности дыхания.\n"
  file:
  - ЦК_День 5.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_5_practice
- id: day_5_practice
  text: "<b>10 минут внимания к себе </b>\n\nПользу короткой практики для внимания изучали Xu и соавторы (2017): в их исследовании медитация помогла предотвратить нарастание блуждания ума – ухода в мысли, не связанные ни с заданием, ни с окружающей обстановкой. Регулярную практику исследовали Basso и соавторы (2019): люди без опыта медитации в течение восьми недель ежедневно слушали либо 13-минутную медитацию с вниманием к дыханию и телу, либо подкаст; по сравнению с контрольной группой у практиковавших улучшились показатели внимания и памяти, уменьшились негативные эмоциональные состояния и тревога в ответ на лабораторную стрессовую ситуацию.\n\nУстройтесь поудобнее и выделите 10 минут, в течение которых сможете побыть с собой!\n\np.s. Для вашего удобства мы предлагаем аудио- и текстовый формат. \n"
  file:
  - ЦК_10 минут внимания к себе.pdf
