- id: day_10_info
  delay_seconds: 1
  text: "<b>Гнев тоже о чем-то сообщает</b>\n\nЭмоционально чувствительные люди нередко переживают раздражение и гнев острее других – и вдобавок тревожатся: «со мной что-то не так, если я злюсь». Между тем раздражение и гнев могут стать поводом внимательнее разобраться, какие из наших интересов или потребностей оказались нарушены в общении.\n\nТак, Sell и соавторы (2009) проверяли теорию, согласно которой гнев возникает, когда человеку кажется, что окружающие недостаточно учитывают его благополучие. Авторы предположили, что эта эмоция связана с готовностью добиваться изменения отношения к себе. В двух исследованиях физически более сильные мужчины чаще сообщали о склонности к гневу и об успехе в разрешении разногласий в свою пользу. У женщин сходные связи обнаружили с оценкой собственной привлекательности.\n\nЗдесь уместен вопрос: «значит ли это, что гневаться правильно и полезно?» Нет. Исследование говорит о функции переживания гнева, а не о пользе гневного поведения: гнев ценен как информация о нарушенном интересе, а как способ действия чаще мешает.\n\nДля повседневного общения из этой идеи можно извлечь полезный ориентир: заметив раздражение, попробовать понять, что именно для вас важно. Чувство помогает сформулировать вопрос, который стоит прояснить.\n\nСегодня мы предлагаем вам практику «Календарь неприятных переживаний», которая направлена на проработку негативных состояний. \n"
  file:
  - ЦК_День 10.png
  buttons:
