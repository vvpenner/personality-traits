- id: day_10_practice
  text: "<b>Календарь неприятных переживаний </b>\n\nЗачем фиксировать неприятные переживания так подробно? Исследования с использованием нейровизуализации позволяют предположить ответ: когда человек называет своё переживание словами, активность миндалины — структуры, участвующей в эмоциональной реактивности, — снижается, а активность префронтальных зон, связанных с регуляцией, возрастает (Lieberman et al., 2007). Для эмоционально чувствительных людей это может быть особенно значимо: подробное описание эпизода — это способ перевести переживание из формы «накрыло» в форму, с которой можно работать. Поэтому сегодняшняя практика просит вас не просто вспомнить неприятное событие, а разобрать его по элементам.  \n\nЕсли сегодня вы заметите раздражение или гнев – возьмите для заполнения именно этот эпизод; если такого эпизода не будет, подойдёт любое неприятное переживание. Используйте следующие вопросы, чтобы сосредоточить своё осознание на деталях переживания, когда оно происходит. После заполните таблицу по примеру с картинки:\n\n1. Что вы переживали? \n\n2. Что ощущали в теле? \n\n3. Какие настроения и чувства у вас были? \n\n4. Какие мысли возникали? \n\n5. Какие мысли по этому поводу сейчас? \n"
  file:
  - ЦК_День 10. Практика.png
