- id: day_13_info
  delay_seconds: 1
  text: |
    <b>Неожиданная сторона нашей тревожности</b>

    Quek, Yang и Hartanto (2025) изучили стили разрешения конфликтов у 259 молодых взрослых. Поведение каждого участника оценивали двумя способами: спрашивали его самого (самоотчёт) и привлекали независимых наблюдателей, которые оценивали его действия со стороны.

    Два способа оценки дали противоположную картину. По самоотчётам оказалочь, что чем выше нейротизм, тем менее конструктивные стратегии человек себе приписывал. По оценкам наблюдателей вышла иная картина: участники с более высоким нейротизмом внешне чаще вели себя конструктивно. Была и вторая закономерность: высокая добросовестность смягчала неблагоприятную связь в самоотчётах и усиливала благоприятную – в оценках наблюдателей (Quek et al., 2025).

    Как это понимать? Одно из возможных объяснений: тревожные люди судят себя строже, чем на самом деле выглядит их реальное поведение, то есть внутреннее напряжение и видимые шаги к соглашению вполне могут сосуществовать. Для эмоционально чувствительного человека здесь есть важное следствие, которое пока остаётся гипотезой: собственная оценка своего поведения в конфликте может оказаться строже, чем то, что видят окружающие.

    Сегодня мы предлагаем вам практику «Работа над проблемами», которая тренирует не избегать трудного переживания, а оставаться рядом с ним. Вы выберете одну нерешённую ситуацию умеренной тяжести (например, затянувшееся недопонимание с кем-то из близких) и, следуя инструкциям, постепенно перенесёте внимание с мыслей о ней на то, как она отзывается в теле: где именно оно ощущается и как меняется, если направлять туда дыхание.
