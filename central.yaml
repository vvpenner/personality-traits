    До встречи завтра!
- id: day_21_info
  delay_seconds: 1
  text: |
    <b>Беспокойство может стать планом</b>

    Питер Голльвицер и Вероника Брандштеттер сравнили два вида намерений: простое «я хочу достичь X» и то же намерение с планом «если наступит ситуация Z, я сделаю Y». В их экспериментах участники заранее связывали действие с определённым обстоятельством – и это заметно меняло результат. Так, трудный проект на каникулы без плана завершали лишь 22% участников, а с планом – 62%; когда задачу назначал экспериментатор, отчёт вовремя написали 71% планировавших против 32% не планировавших. В другом задании такая связь помогала быстрее начать действие при подходящем сигнале (Gollwitzer & Brandstätter, 1997). Характерно, что с лёгкими делами план почти ничего не менял – их и без него выполняли почти все. План нужен там, где намерению что-то мешает.

    Это исследование проверяло планы формата «если – то». Оно подсказывает один из путей, по которому размышление о трудности становится подготовкой: в обоих случаях роль играет связь между ситуацией и доступным действием. План на случай нехватки времени отличается от общего намерения «справиться» тем, что позволяет заранее понять, когда и с чего начинать.

    Сегодня мы предлагаем вам практику «Оставаться в настоящем»: план «если – то» работает, только если вы замечаете момент, когда наступило предусмотренное обстоятельство, а замечать наступающий момент – это и есть тренируемый данной практикой навык.
  file:
  - ЦК_День 21.png
  buttons:
