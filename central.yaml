- id: day_16_outro
  text: "Спасибо, что уделили время практике! Как вы себя чувствуете после нее? \n\nНам не нужно бороться с мыслями, сопротивляться им или судить их. Скорее, мы можем просто решить не следовать им, как только осознаем, что они возникают. Наша главная цель – ясно увидеть мысли, чтобы мы могли выбрать те, на основе которых будем действовать, и те, которые просто оставим.\n\nДо встречи завтра!\n"
- id: day_17_info
  delay_seconds: 1
  text: |
    <b>Когда тревога помогает подготовиться к определенному событию? </b>

    Перед важным делом нам обычно советуют успокоиться. Психолог Майя Тамир проверила, работает ли этот совет для всех одинаково. В серии из четырёх исследований оказалось, что люди с более высоким нейротизмом перед сложным заданием чаще предпочитали не успокаиваться, а усилить беспокойство – и по собственным отчётам, и по реальному выбору в эксперименте (Tamir, 2005). Ключевая деталь: перед простым заданием такой связи не было. Выбор состояния зависел от ожидаемых требований, а не от привычки волноваться как таковой.

    Есть ли от этого выбора польза? Данные одного из экспериментов указывают, что кратковременное беспокойство при определённых условиях могло сопровождаться более успешным выполнением задачи (Tamir, 2005). Один возможный механизм состоит в том, что беспокойство направляет внимание на то, где нужно приложить усилия. Но выбор состояния и реальная польза от него – отдельные вопросы: эти данные получены в лаборатории и касаются кратковременного состояния перед конкретной задачей, а не постоянной тревоги. Для новой ситуации важно учитывать сложность задачи и то, даёт ли повышенная настороженность информацию, которая пригодится при её выполнении.

    Сегодня мы вновь предлагаем вам повторить любую из пройденных практик.
