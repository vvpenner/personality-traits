    text: Начать практику
    action: begin_practice
    event: day_21_practice
- id: day_21_practice
  text: "<b>Оставаться в настоящем </b>\n\nСегодня попробуем замечать, что происходит в теле во время обычных дел. В течение десяти минут вы будете замечать, что происходит в теле прямо посреди привычных дел, – позу, опору, движение, прикосновения. Если внимание уйдёт в мысли или планы, задача – мягко вернуть его к ощущениям, не ругая себя за отвлечение.\n\nНачните прямо сейчас, пока читаете это сообщение, и попробуйте делать это в течение 10 минут. \n\nВ какой позе вы находитесь? Где чувствуете опору? Когда встанете, обратите внимание на то, как вес переносится на стопы и как вы выпрямляетесь. Обращайте также внимание на то, как тело двигается, как соприкасается с другими предметами. Подмечайте каждую деталь. \n\nЕсли внимание переключится на мысли или дела, мягко верните его к тому, что ощущаете прямо сейчас. Так вы сможете практиковать осознанность прямо посреди привычных дел.\n"
