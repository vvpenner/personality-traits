    text: Начать практику
    action: begin_practice
    event: day_25_practice
- id: day_25_practice
  text: "<b>Незапланированная медитативная передышка</b>\n\nЭта практика пригодится при столкновении с внезапным неприятным событием: она занимает около трёх минут и не требует особых условий.\n\nСознательно примите удобную для себя позу\n\nУзнайте и констатируйте свои текущие переживания: мысли, чувства, ощущения в теле\n\nСоберите все внимание на вдохах и выдохах \n\nРасширьте осознание на все тело в целом, а затем – на те переживания, что присутствуют у вас, посмотрев на картинку \n"
  file:
