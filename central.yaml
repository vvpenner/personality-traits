- id: day_8_info
  delay_seconds: 1
  text: "<b>Чувствовать больше – замечать больше</b>\n\nПоздравляем с началом второй недели практикума! На этой неделе мы рассмотрим, как эмоциональная чувствительность может помогать замечать происходящее в общении\n\nВ небольшом исследовании Doty и соавторов (2013) 21 участнику показывали фотографии лиц всего на 33 миллисекунды, после чего изображение закрывали другим лицом. Нужно было определить, присутствовало ли выражение страха на лице. Более высокий нейротизм был связан с лучшим различением испуганных лиц и лиц без выражения страха. \n\nВ повседневном общении за замеченным сигналом следует его объяснение. Например, мы слышим короткий ответ и предполагаем, что собеседник недоволен нами. Однако причиной могут быть усталость, спешка или погружённость в собственные мысли. Обзор Ormel и соавторов (2013) показывает, что при высоком нейротизме неоднозначная информация чаще получает негативное толкование. Поэтому возможная польза чувствительности раскрывается вместе с привычкой уточнять: что именно я заметил, какое объяснение предложил и достаточно ли у меня сведений для такого вывода?\n\nСегодня мы предлагаем практику «Встреча на улице», которая помогает различать событие, его интерпретацию и эмоциональную реакцию.\n"
  file:
  - ЦК_День 8.png
