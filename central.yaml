- id: day_27_info
  delay_seconds: 1
  text: "<b>Не нужно отказываться от своей чувствительности</b>\n\nЭвелин Сниппе и коллеги попросили 553 участника трижды в день записывать настроение и свои действия по отношению к другим. Оказалось, что после добрых, заботливых действий настроение участников улучшалось – и у людей с более высоким нейротизмом эта связь была сильнее (Snippe et al., 2018).\n\nПолучается, что наша чувствительность усиливает не только отклик на неприятное, но и отклик на тепло, которое мы сами создаем. Забота о другом человеке, поддержка, маленькая помощь – все это для чувствительного человека не мелочь, а действие с особенно заметной позитивной отдачей. Здоровый нейротизм здесь означает буквально следующее: не глушить чувствительность, а давать ей больше поводов сработать «в плюс».\n\nСегодня мы предлагаем вам практику «Мой план действий», которую мы будем выполнять два дня. Эта практика помогает подготовить фундамент помощи самому себе в трудные минуты. \n"
  file:
  - ЦК_День 27.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_27_practice
- id: day_27_practice
  text: "<b>Мой план действий: часть 1</b>\n\nСегодня мы подготовимся к заполнению собственного плана действий на случай трудных ситуаций, ответив на несколько важных вопросов. Пожалуйста, найдите 10-20 минут на себя и запишите ответы на вопросы, что представлены ниже. \n\nЧто помогало вам в прошлом, когда вы начинали чувствовать себя плохо?\n\nКаким может быть адекватный ответ на душевную боль или плохое настроение? Как лучше всего отреагировать на хаос в мыслях и чувствах, не ухудшая положение (включая то, что вы узнали в ходе этого курса)?\n\nКак лучше всего позаботиться о себе в эти трудные и болезненные моменты (например, предметы, которые могли бы вас успокоить, действия, которые могли бы вас поддержать, люди, с которыми вы могли бы контактировать, чтобы мудро ответить на свой дистресс)?\n\nКакие препятствия в прошлом мешали вам предпринимать полезные действия, чтобы помочь себе, когда все начинало выходить из-под контроля? Как вы могли бы справиться с этими препятствиями, если они возникли бы в будущем?\n"
  file:
  - ЦК_Мой план действий.pdf
  buttons:
  - id: finish_practice
    text: Завершить практику
    action: finish_practice
    event: day_27_outro
- id: day_27_outro
  text: |
    Спасибо, что уделили время практике! Осознайте и обдумайте все написанное еще раз, а завтра мы продолжим выполнять эту практику. До встречи!
- id: day_28_info
  delay_seconds: 1
  text: "<b>Посмотреть на себя по-новому</b>\n\nПатрик Клайбер и коллеги изучили две большие выборки: почти две тысячи человек в одной и около восьмисот в другой восемь вечеров подряд рассказывали о событиях дня и своём настроении (Klaiber et al., 2022). Оказалось, что люди с высоким нейротизмом сообщали о приятных событиях не реже остальных, то есть хорошего в их днях не меньше. Более того, в одной из выборок такие люди показали больший прирост позитивного аффекта в дни с приятными событиями, то есть хороший день поднимал им настроение сильнее. Эти результаты помогают предположить, что эмоциональная система, которая острее реагирует на неприятности, способна давать ещё и более щедрую отдачу от хорошего.\n\nЗдесь можно подвести итог нашей заключительной недели: важно не уменьшать собственную чувствительность, а давать ей больше поводов сработать «в плюс» – замечать приятное, позволять эмоциям быть, заботиться о других. \n\nВ качестве заключительной практики мы предлагаем «Мой план действий, часть 2»\n"
