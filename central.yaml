    Спасибо, что уделили время практике. До встречи завтра!
- id: day_6_info
  delay_seconds: 1
  text: "<b>Сигнал – не приговор</b>\n\nСвязь эмоциональной чувствительности со здоровьем может зависеть от того, как человек воспринимает своё самочувствие и реагирует на возможное неблагополучие.\n\nGale и соавторы (2017) проанализировали данные 321 456 участников UK Biobank. Среди людей, оценивавших своё здоровье как удовлетворительное или плохое, более высокий нейротизм был связан с более низкой смертностью от всех причин; наиболее устойчивой эта связь была в группе с удовлетворительной самооценкой здоровья. Дополнительно исследователи рассмотрели отдельные составляющие нейротизма. Склонность к беспокойству и переживанию уязвимости также была связана с более низкой смертностью, причём эта связь обнаруживалась и без статистического учёта самооценки здоровья.\n\nСегодня мы предлагаем продолжить развивать внимательное отношение к своему состоянию и повторить одну из знакомых практик.\n"
  file:
