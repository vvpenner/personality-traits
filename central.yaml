- id: day_15_practice
  text: "<b>Офис </b>\n\nВ лонгитюдном исследовании нейротизм предсказывал склонность негативно истолковывать неоднозначные социальные сценарии – вроде торопливо прошедшего коллеги (Vinograd et al., 2020). Другая линия работ показывает, что привычка негативно толковать неоднозначное поведение близкого человека частично объясняет связь нейротизма с меньшей удовлетворённостью отношениями (Finn, Mitte & Neyer, 2013), а снижение таких негативных толкований предсказывало снижение нейротизма за девять месяцев наблюдений (Finn, Mitte & Neyer, 2015). Наконец, метаанализ программ тренировки интерпретаций показал небольшое, но значимое снижение тревожных симптомов (Hallion & Ruscio, 2011) – поэтому наше сегодняшнее упражнение стоит рассматривать как способ заметить собственную склонность к толкованиям.\n\nСосредоточьтесь на несколько минут, чтобы как можно ярче представить данную сцену.\n\nВы расстроены, поскольку только что поссорились с коллегой. Вскоре после\n\nэтого вы видите в холле другую коллегу, которая быстро убегает, говоря вам,\n\nчто у нее ни минуты свободного времени.\n\nЗапишите здесь мысли, которые придут вам на ум.\n\nТеперь представьте себе такую сцену.\n\nВы чувствуете себя счастливым, потому что вас и вашу коллегу только что похвалили за хорошую работу. Вскоре после этого вы видите в зале еще одну коллегу, которая быстро убегает, говоря вам, что не может остаться ни на минуту.\n\nЗапишите здесь мысли, которые придут вам на ум.\n\nТеперь посмотрите, как вы описали свой ответ на два сценария. Запишите все, что поразило вас в своих мыслях о двух ситуациях.\n"
