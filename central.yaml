- id: day_19_outro
  text: |
    Спасибо, что уделили время практике! В обоих сценариях человек слушает любимую музыку. В первом он пытается избавиться от грусти и следит за тем, меняется ли его настроение.

    Постоянная проверка может удерживать внимание на том, что грусть всё ещё присутствует.

    Во втором сценарии музыка служит способом позаботиться о себе, пока грусть сохраняется. Такое действие может быть ценным, даже если настроение меняется постепенно.

    Важно совершать приятные и эффективные действия с добротой к себе и намерением позаботиться о себе.

    До встречи завтра!
- id: day_20_info
  delay_seconds: 1
  text: |
    <b>Осторожность и смелость</b>

    Прокручивать мысли снова и снова — вредно? Не обязательно. В большом обзоре исследований повторяющегося мышления Эдвард Уоткинс показал, что его последствия зависят, среди прочего, от ситуации и уровня конкретности: абстрактные вопросы об общем смысле неприятностей и конкретные вопросы о ходе событий ведут к разным способам обработки одного и того же опыта (Watkins, 2008).

    В подготовке к трудному разговору вопрос: «Почему у меня всегда так?» может удерживать внимание на общей оценке себя. Вопрос: «На каком моменте разговора я теряюсь?» помогает выделить место, где возможен выбор. Такая конкретизация не решает саму проблему, но меняет предмет размышления. Пользу размышления можно оценивать по тому, появилось ли новое понимание ситуации и/или доступный шаг. Для эмоционально чувствительного человека привычка подолгу размышлять о трудностях хорошо знакома – поэтому этот критерий особенно полезен.

    Сегодня мы предлагаем повторить любую из пройденных практик.
