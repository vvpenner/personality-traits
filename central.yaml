- id: day_22_outro
  text: |
    Спасибо, что уделили время практике! Если вы обнаружили причину, по которой надо практиковать осознанность, связанную с чем-то, что вам глубоко небезразлично, запишите ее ниже, чтобы она была здесь, и вы могли обратиться к ней, когда вам будет нужно - чтобы напомнить себе о ней, еще раз вдохновиться и восстановить связь с глубинной причиной продолжать практику.

    До встречи завтра!
- id: day_23_info
  delay_seconds: 1
  text: "<b>Радость тоже бывает сильной </b>\n\nМы привыкли думать, что радость и грусть – как плюс и минус: чем больше одного, тем меньше другого. Джеффри Ларсен, Питер МакГроу и Джон Качиоппо проверили это там, где эмоции неизбежно двойственны. Так, людей спрашивали об их переживаниях до и после фильма «Жизнь прекрасна», в день выезда из общежития и на выпуске из колледжа. В обычные дни одновременно радость и грусть отмечали 10–20% участников, но после фильма их было 44%, а в день выпуска – каждый второй (Larsen et al., 2001).\n\nТакая картина понятна, если различать стороны одного события. Выпуск означает завершение важного дела и расставание с людьми. Каждая сторона может вызвать своё переживание, и эти переживания не вычитаются друг из друга, а складываются. \n\nДля эмоционально чувствительного человека это особенно важная новость: если вы проживаете трудное ярко, та же чувствительность позволяет ярко проживать и хорошее – причём одно не требует отмены другого. \n\nСегодня мы предлагаем вам вновь повторить любую из понравившихся вам практик.\n"
  file:
  - ЦК_День 23.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_23_practice
- id: day_23_practice
  text: "<b>Повторение </b>\n\nПовторение – это не формальность, а способ увидеть знакомое упражнение в новом «эмоциональном освещении»: вчерашняя практика в сегодняшнем состоянии может ощущаться иначе, и это само по себе наблюдение за тем, как переживания складываются и сменяют друг друга.\n\nНайдите сегодня свободное время для себя и, как будете готовы, начните практику. \n"
  file: []
  buttons:
  - id: finish_practice
    text: Завершить практику
    action: finish_practice
