- id: day_18_info
  delay_seconds: 1
  text: "<b>Предусмотрительность – это не слабость </b>\n\nТревожных людей часто уговаривают «не накручивать себя» перед важным делом. Стейси Спенсер и Джули Норем проверили, что происходит, если последовать этому совету. Защитные пессимисты перед заданием либо представляли, как справляются с возможными трудностями, либо расслаблялись. При мысленной репетиции способов справиться они выполнили задание лучше, чем при предварительном расслаблении (Spencer & Norem, 1996). \n\nИз результата следует практическое различие между прогнозом препятствия и репетицией ответа на него. Утверждение «я могу растеряться» оставляет решение открытым. Представление того, как человек берёт паузу и продолжает, делает прогноз частью подготовки. Для людей с высокой тревожностью это различие особенно значимо: привычка продумывать трудности остаётся ресурсом, когда превращается в репетицию ответа.\n\nСегодняшняя практика – тоже своего рода репетиция ответа, только не на рабочую задачу, а на моменты с низким настроением: мы предлагаем заранее составить «Список приятных и эффективных действий».\n"
  file:
  - ЦК_День 18.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_18_practice
- id: day_18_practice
  text: "<b>Список приятных и эффективных действий </b>\n\nИдея предлагаемого упражнения проста: когда настроение снижено и энергии мало, придумать, чем себя поддержать, труднее всего – именно в этот момент. Поэтому список составляют заранее, в спокойном состоянии. Это та же предусмотрительность, о которой шла речь выше, только применённая к собственному состоянию: вы готовите конкретный ответ на будущую трудность, пока есть ресурс его подготовить.\n\nОказывается, что, когда люди чувствуют себя подавленными, истощенными и испытывающими недостаток энергии, особенно эффективны в поднятии настроения два типа действий.\n\nПриятные действия – те, которые приносят чувство удовольствия или\n\nнаслаждения (например, пригласить друга, чтобы поболтать, неторопливо\n\nпринять горячую ванну или пойти на прогулку).\n\nЭффективные действия - те, которые приносят ощущения выполненного долга, удовлетворения или контроля (например, написать письмо, подстричь газон, сделать что-то, что вы давно откладывали).\n\nПопробуйте составить для себя сначала список приятных действий, а после – список эффективных действий. Напишите 5-10 таких действий в каждом списке. \n"
  file: []
  buttons:
  - id: finish_practice
    text: Завершить практику
    action: finish_practice
    event: day_18_outro
- id: day_18_outro
  text: "Спасибо, что уделили время практике! Теперь у вас есть ценный инструмент для поддержания себя в трудные минуты. Попробуйте использовать его, когда сталкиваетесь с неприятными переживаниями. \n\nДо встречи завтра!\n"
- id: day_19_info
  delay_seconds: 1
  text: "<b>Сила реалистичных ожиданий</b>\n\nКто вообще пользуется защитным пессимизмом? Это изучали И. Текин и коллеги на большой выборке старшеклассников, готовившихся к вступительному экзамену в университет – ситуации с очень высокой ставкой. Участники заполняли опросники защитного пессимизма, тревоги, когнитивной гибкости и личностных черт. Вместе эти показатели объясняли 44% различий в баллах защитного пессимизма (Tekin et al., 2023). Другими словами, стратегия низких ожиданий и продумывания исходов связана с определённым сочетанием тревоги, черт и стиля мышления – она не появляется случайно. \n\nЭто помогает понять, что ваша привычка продумывать трудности – закономерная часть вашего склада, а значит, можно признать её рабочим инструментом, который вполне возможно использовать осознанно.\n\nСегодня мы предлагаем вам ещё раз посмотреть на практику «Список приятных и эффективных действий» — на этот раз с руководством по применению.\n"
  file:
  - ЦК_День 19.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_19_practice
- id: day_19_practice
  text: "<b>Список приятных и эффективных действий: руководство по применению </b>\n\nПрочтите два сценария, которые представлены на карточках. Затем подумайте о том, почему два одинаковых действия в итоге могли привести к разным последствиям? \n"
  file:
