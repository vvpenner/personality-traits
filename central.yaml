- id: day_7_practice
  text: "<b>Трехминутная медитативная передышка </b>\n\nЭффект такой передышки изучали Bolzenkötter и соавторы (2025): после медитации участники в среднем сообщали о меньшей выраженности негативных эмоций и руминации –  повторяющегося прокручивания неприятных мыслей. Похожую картину даёт метаанализ 15 лабораторных экспериментов: короткие упражнения осознанности в среднем помогали регулировать вызванные в эксперименте негативные эмоции лучше, чем контрольные задания (Leyland et al., 2019).\n\nПрактика состоит из трёх этапов, примерно по минуте каждый. Сначала вы замечаете мысли, чувства и телесные ощущения, позволяя им присутствовать. Затем сосредоточиваетесь на естественном дыхании и ощущениях каждого вдоха и выдоха. Наконец, расширяете внимание на тело целиком: его положение, выражение лица, напряжение или расслабление. Завершая передышку, попробуйте сохранить это внимание к себе при возвращении к делам.\n\np.s. Для вашего удобства мы предлагаем аудио- и текстовый формат. \n"
