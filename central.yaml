  text: "<b>Внимание к другим</b>\n\nВ эксперименте Butler и коллег незнакомые люди в парах обсуждали неприятную тему, и один из участников получал инструкцию скрывать свои эмоции. Результат касался не только его самого: контакт в разговоре был слабее, а у второго собеседника – который не получал никаких инструкций – усиливалась реакция артериального давления. Попытка одного человека спрятать переживание изменила состояние другого (Butler et al., 2003).\n\nОтсюда два вывода. Первый: сдерживаемое напряжение не исчезает из разговора – оно передаётся собеседнику, даже когда его не видно. Второй: скрывая эмоции, мы оставляем для другого меньше сведений о том, что для нас важно, и ему труднее понять происходящее. Сдержанность не бывает «нейтральной»: она влияет на того, кто рядом.\n\nЭто не значит, что сдерживаться нельзя: иногда пауза помогает не сказать лишнего на пике чувств. Но в такие моменты полезно внимательно следить за другим человеком: понятно ли ему, что с вами происходит, не выглядит ли ваша сдержанность равнодушием, не напрягается ли он сам. Замечать не только своё состояние, но и то, как ваш способ справляться с ним отзывается собеседнику, – это и есть внимание к другим.\n\nДля людей с высокой эмоциональной чувствительностью эта тема особенно значима: интенсивные переживания труднее скрывать, такая попытка требует больше усилий – и потому сдержанность стоит выбирать осознанно, зная её возможную цену для контакта.\n\nСегодня мы предлагаем вам повторить любую из уже пройденных практик. \n"
