- id: day_16_practice
  text: "<b>Поезд ассоциаций </b>\n\nУ людей с депрессией в анамнезе способность воспринимать негативные мысли как проходящие психические события предсказывала меньший риск рецидива, а курсы когнитивной терапии и MBCT, снижавшие рецидив, одновременно повышали эту способность (Teasdale et al., 2002).\n\nЗакройте глаза и представьте, что вы сидите в кинотеатре. Но экран пустой, и вы смотрите на него. \n\nПодождите, когда начнут возникать ваши собственные мысли.  \n\nЧто именно они собой представляют? Что происходит с ними? Какие из них особенно завладевают нами и почему? \n\nЗапишите эти мысли и проанализируйте их. \n"
