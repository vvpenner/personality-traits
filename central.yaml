# на delay_minutes: 1440, а у posttest — на delay_minutes: 43200.

messages:
- id: start
  text: "Добро пожаловать на практикум «Новый взгляд на тревожность»!\n\nЕсли вы часто волнуетесь, глубоко переживаете события и тонко реагируете на происходящее – этот курс для вас. Обычно такую чувствительность называют нейротизмом и говорят о ней как о слабости. Мы предлагаем посмотреть на нее иначе: одна и та же черта может работать по-разному в зависимости от ситуации и от того, какими навыками человек располагает. Эта идея лежит в основе концепции «здорового нейротизма» (Friedman, 2000), и данный практикум основывается на этой концепции.\n\nКаждая неделя будет посвящена определенной теме. На первой неделе мы разберём, как чувствительность связана с заботой о здоровье, на второй – как она проявляется в конфликтах и отношениях, на третьей – как привычка продумывать трудности превращается в подготовку, на четвёртой – почему сильные переживания касаются не только неприятного, но и приятного. Параллельно каждый день вы будете осваивать короткие упражнения на осознанность из рабочей тетради по когнитивной терапии, основанной на осознанности (MBCT).\n\nПрактикум рассчитан на 28 дней: каждый день вы будете получать короткое сообщение и одну практику. Пожалуйста, выполняйте задания в своём темпе, но регулярно. \n\nИ приятное дополнение: среди всех, кто пройдёт опрос через месяц после завершения практикума, рандомайзер выберет трёх участников, каждый из которых получит по 10 000 рублей :)\n\nПо всем вопросам вы можете обращаться к @vv_penner. До встречи на первом занятии!\n"
  file:
  - ЦК_Титульный лист.png
  buttons:
  - id: start_course
    text: Начать курс
    action: start_course
    event: day_1_info
- id: day_1_info
  delay_seconds: 1
  text: "<b>Тревога бывает полезной</b>\n\nНа этой неделе мы посмотрим на тревожность с необычной стороны, а именно – разберем, как она может способствовать нашему здоровью, и научимся нескольким важным навыкам.\n\nКогда тревога помогает? Один из способов ответить на этот вопрос – посмотреть на то, что человек делает после того, как заметил возможную угрозу. Так, в исследовании взрослых с высоким нейротизмом – чертой личности, которая включает склонность к тревоге, – было выявлено, что нейротизм связан с более внимательным отношением к здоровью. Повышенная бдительность, в свою очередь, коррелировала с более здоровыми привычками. Так исследователи проследили один из путей, по которому тревожность может способствовать заботе о здоровью (Weston & Jackson, 2018).\n\nСегодня мы предлагаем вам нашу первую практику, направленную на развитие осознанного внимания к себе, – «Ешьте изюм осознанно».\n"
  file:
  - ЦК_День 1.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_1_practice
- id: day_1_practice
  text: "<b>Ешьте изюм осознанно</b>\n\nЭффект предлагаемой практики изучали Arch и соавторы (2016): участники, которые сосредоточились на ощущениях во время еды, получили от изюма больше удовольствия, чем участники без такой инструкции.\n\nВам понадобится несколько изюминок (или чего угодно!) для этой практики на осознанное присутствие в моменте. Сядьте удобно там, где есть хорошее освещение и вас не будут беспокоить. Затем медленно настройте себя на прохождение практики. \n\nЖелаем вам хорошей практики!\n\np.s. Для вашего удобства мы предлагаем два формата: аудио- и текстовый формат. \n"
  file:
  - ЦК_Ешьте изюм осознанно.pdf
  buttons:
  - id: finish_practice
    text: Завершить практику
    action: finish_practice
    event: day_1_outro
- id: day_1_outro
  text: "Поздравляем вас с прохождением первой практики! Спасибо, что уделили ей время. Как вы оцениваете этот опыт? Что вы ощущали? Чем этот опыт отличается от обычного опыта еды? \n\nДо встречи завтра! \n"
- id: day_2_info
  delay_seconds: 1
  text: "<b>Внимание к себе</b>\n\nБеспокойство о здоровье может побуждать человека внимательнее относиться к своему самочувствию. \n\nТак, при повышенном нейротизме телесные ощущения чаще становятся предметом внимания и размышлений, и такая чувствительность может поддерживать заботу о себе, если замеченные изменения побуждают человека разобраться в своём состоянии и пересмотреть привычки.\n\nЭту возможность изучили Weston и Jackson (2018) в исследовании с участием 1055 человек. Участники с более высоким нейротизмом чаще сообщали, что обращают внимание на ощущения в теле. При сопоставимом уровне нейротизма более выраженное внимание к ощущениям было связано с более здоровым поведением. Таким образом, исследователи обнаружили возможный благоприятный путь связи нейротизма со здоровьем через внимание к собственному состоянию, хотя в целом нейротизм был связан с менее здоровыми привычками.\n\nСегодня мы предлагаем вам практику привнесения осознанности в повседневные дела – она помогает быть более внимательными к своим ощущениям и состояниям в моменте. \n"
  file:
  - ЦК_День 2.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_2_practice
- id: day_2_practice
  text: "<b>Привнесение осознанности в повседневные дела </b>\n\nВ эксперименте с 51 студентом участники, которые мыли посуду осознанно, отмечали снижение нервозности и усиление вдохновения после занятия (Hanley et al., 2015). В другом исследовании с 139 участниками восьминедельная программа коротких и неформальных практик осознанности способствовала снижению стресса, тревожных и депрессивных симптомов и повышению удовлетворенности жизнью по сравнению с группой ожидания (Shankland et al., 2021).\n\nВыберите привычное занятие – например, мытьё посуды, прогулку или чаепитие – и сосредоточьтесь на своих ощущениях: замечайте движения тела, звуки, запахи, температуру и прикосновения. Когда внимание отвлекается, спокойно возвращайте его к происходящему. Постарайтесь наблюдать за своим опытом с любопытством, позволяя ощущениям быть такими, какие они есть. Так повседневное занятие становится возможностью практиковать осознанность. \n\nЖелаем вам приятной практики!\n"
  file: []
  buttons:
  - id: finish_practice
    text: Завершить практику
    action: finish_practice
    event: day_2_outro
- id: day_2_outro
  text: "Как вы себя чувствуете после практики? Осознайте свои ощущения, проанализируйте их, возможно, запишите их, закрепите этот опыт повторением практики. До встречи! \n"
- id: day_3_info
  delay_seconds: 1
  text: "<b>Беспокойство, которое побуждает действовать</b>\n\nБеспокойство о здоровье может побуждать человека пересматривать свои привычки. Особенно интересен случай, когда оно сочетается с добросовестностью – склонностью планировать действия и доводить намеченное до конца. \n\nWeston и Jackson (2015) обнаружили, что после постановки серьезного хронического диагноза более высокий нейротизм был связан с меньшей вероятностью курения у людей с высокой добросовестностью. До появления заболевания такой связи между сочетанием этих черт и курением не наблюдалось.\n\nОдно из возможных объяснений состоит в том, что диагноз делает угрозу здоровью более конкретной. Беспокойство может усиливать желание позаботиться о себе, а организованность и настойчивость – помогать воплощать это желание в действиях. Так эмоциональная чувствительность и способность следовать своим решениям могут дополнять друг друга. \n\nСегодня предлагаем вам повторить любую из пройденных практик. Это хорошая возможность перейти от намерения позаботиться о себе к конкретному действию.\n"
  file:
  - ЦК_День 3.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_3_practice
- id: day_3_practice
  text: "<b>Повторение</b>\n\nЗначение самостоятельной практики изучали Parsons и соавторы (2017). В метаанализе 28 исследований с 898 участниками программ осознанности больший объём домашних медитативных занятий был связан с более выраженными положительными результатами программ.\n\nДаже если инструкция та же, ваши мысли, ощущения и эмоции сегодня могут быть другими. Попробуйте подойти к практике с любопытством, без требования получить от нее определенный результат.\n\nВыберите знакомую практику – и начнем!\n"
  file: []
  buttons:
  - id: finish_practice
    text: Завершить практику
    action: finish_practice
    event: day_3_outro
- id: day_3_outro
  text: "Спасибо, что уделили время практике! Как вы себя чувствуете после нее? Завтра мы подробнее поговорим про связку добросовестности и нейротизма. До встречи! \n"
- id: day_4_info
  delay_seconds: 1
  text: "<b>Неожиданный союз</b>\n\nМы уже знаем, что связка нейротизма и добросовестности порой может приводить к позитивным последствиям. Сегодня рассмотрим ещё одно положительное следствие такой связки.\n\nТак, например, эмоциональная чувствительность может сочетаться с благоприятными показателями физического здоровья. В исследовании с участием 1054 человек более высокий нейротизм в сочетании с высокой добросовестностью был связан с более низким уровнем интерлейкина-6 – одного из маркеров воспаления (Turiano et al., 2013). Авторы предложили возможное объяснение этой связи: беспокойство о здоровье может побуждать человека внимательнее относиться к своему состоянию, а организованность и самодисциплина – помогать ему поддерживать полезные привычки и последовательно заботиться о себе.\n\nСегодня для развития навыка более осознанного проживания своих состояний мы предлагаем вам практику «Другой способ познания», показавшую свою эффективность в научных исследованиях. \n"
  file:
  - ЦК_День 4.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_4_practice
- id: day_4_practice
  text: "<b>Другой способ познания </b>\n\nУсловно способы познания можно разделить на два типа: аналитическое обдумывание и непосредственное переживание. Так, в научных экспериментах внимание к непосредственным переживаниям, по сравнению с аналитическим обдумыванием своего состояния, способствовало более конкретным воспоминаниям у людей с депрессией и меньшему числу непроизвольных возвращений к пережитой неудаче (Watkins & Teasdale, 2004; Watkins, 2004). \n\nПриятной практики!\n\np.s. Для вашего удобства предлагаем вам аудио- и текстовый форматы.\n"
  file:
  - ЦК_Другой способ познания.pdf
