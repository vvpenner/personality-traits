- id: day_25_outro
  text: "Спасибо, что уделили время практике! После передышки переживания могут измениться или остаться прежними. Оба варианта дают информацию о том, как вы откликаетесь на происходящее.\n\nДо встречи завтра! \n"
- id: day_26_info
  delay_seconds: 1
  text: "<b>Чувствовать – не значит быть слабым</b>\n\nЭмоционально чувствительный человек часто может слышать совет: «Не принимай всё так близко к сердцу». Но исследования показывают почти противоположное: устойчивее оказываются не те, кто чувствует меньше, а те, кто позволяет себе чувствовать. Бретт Форд, Айрис Маусс и коллеги изучали привычное принятие мыслей и эмоций в лаборатории, в дневниках и в продольном наблюдении: у людей с более выраженным принятием неприятные эмоции в ответ на ежедневные стрессоры были слабее (Ford et al., 2018).\n\nПочему так? Сильное переживание само по себе – ещё не страдание. Страдание обычно добавляет второй слой: тревога о тревоге, стыд за грусть, борьба с собственной реакцией. Принятие снимает именно его. Ваша чувствительность при этом никуда не исчезает – она просто перестаёт быть полем боя, это и есть здоровый нейротизм: эмоции остаются сильными, но работают как помощник-сигнализатор о том, что для вас важно, а не как враг, которого нужно победить.\n\nСегодня мы вновь предлагаем вам повторить любую из уже известных вам практик. \n"
  file:
  - ЦК_День 26.png
  buttons:
  - id: begin_practice
    text: Начать практику
    action: begin_practice
    event: day_26_practice
