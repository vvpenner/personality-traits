- id: day_8_outro
  text: "Спасибо, что уделили время практике! Теперь посмотрите на картинку, на которой представлены возможные ответы. \n\nМожно увидеть, что одна и та же ситуация может вызвать широкий спектр мыслей и интерпретаций, и именно они, а не сама ситуация, определяют то, что мы чувствуем: \n\nесли мы думаем, что кто-то игнорирует нас, потому что мы сделали что-то не то, мы расстроены; \n\nесли мы думаем, что кто-то намеренно игнорирует нас, мы злимся; \n\nесли мы думаем, что человек озабочен своими собственными проблемами, мы чувствуем беспокойство, и так далее. \n\nНо, главное, часто мы не осознаём собственные интерпретации ситуаций. Осознанность помогает нам стать более сосредоточенными и дает свободу реагировать по-другому. \n\nДо встречи завтра!  \n"
  file:
  - ЦК_День 8. Практика.png
- id: day_9_info
  delay_seconds: 1
  text: |
    <b>Конфликт начинается не с ссоры</b>

    Эмоциональная чувствительность – одна из составляющих нейротизма – включает также чуткость к возможному отвержению. Напряжение между людьми может возникать ещё до открытого спора – когда ожидание непринятия начинает влиять на то, как мы разговариваем друг с другом.

    Исследование Downey и соавторов (1998) показало: тревожное ожидание отвержения отражается в поведении – оно становится более негативным, а ответ партнёра затем воспринимается как подтверждение первоначального опасения. Получается самосбывающееся пророчество: опасение порождает то, чего человек боится.

    Здесь может возникнуть вопрос: «Но если это особенность моей чувствительности – разве с ней можно что-то сделать?» Можно, и это важный нюанс. В двух исследованиях Ayduk и соавторов (2000) у людей с высокой чувствительностью к отвержению более развитая саморегуляция сочеталась с меньшими трудностями в отношениях. То есть сама чувствительность не предопределяет исход – исход зависит от того, как человек управляет первым импульсом.

    Такие результаты позволяют сделать значимый практический вывод: важно обращать внимание на момент, когда чувство превращается в готовность действовать – например, заметив обиду и желание резко ответить, можно сначала уточнить, что имел в виду собеседник. Так появляется возможность проверить своё предположение и выбрать ответ с учётом происходящего.

    Сегодня мы предлагаем вам повторить любую из уже знакомых практик.
