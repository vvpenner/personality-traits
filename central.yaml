- id: day_21_outro
  text: "Спасибо, что уделили время практике! На этой неделе мы сопоставляли прогноз трудностей и подготовку ответа. Возможность связать прогноз с конкретным действием объясняет, почему размышление о риске бывает полезно в одних условиях и даёт меньше в других.\n\nПоздравляем с завершением 3 недели практикума и просим пройти опрос для отслеживания прогресса с целью получения персонализированной обратной связи и участия в лотерее по итогам практикума. Нажмите на кнопку «Пройти опрос». \n"
