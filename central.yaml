- id: day_25_info
  delay_seconds: 1
  text: |
    <b>Эмоциональная жизнь многогранна</b>

    Принятие переживаний звучит как умение мириться с плохим. Но данные показывают, что оно делает и обратное: расширяет место для хорошего. Эмили Линдсей и коллеги в двух рандомизированных исследованиях разделили два навыка, из которых состоят программы осознанности: наблюдение за опытом и принятие – готовность дать переживанию быть таким, какое оно есть. У взрослых, испытывавших стресс, программы с компонентом принятия дали больший прирост позитивного аффекта в повседневной жизни, чем программы только с наблюдением (Lindsay et al., 2018).

    Для эмоционально чувствительного человека это особенно значимо, ведь чувствительность сама по себе не выбирает сторону: можно ярко проживать и трудное, и приятное. А вот постоянная борьба со своими состояниями отнимает внимание и силы – и тогда эмоциональная жизнь действительно сужается только до неприятного. Принятие убирает именно эту борьбу: не «мне нравится тревога», а «я позволяю ей быть – и остаюсь открытым остальному опыту».

    Сегодня мы хотели бы предложить вам практику «Незапланированная медитативная передышка». Такая передышка после неприятного события – отличный способ не остаться запертым в одном переживании: вы замечаете неприятное, позволяете ему быть и тем самым не даёте ему занять всё пространство дня.
  file:
  - ЦК_День 25.png
  buttons:
