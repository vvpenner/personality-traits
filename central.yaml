- id: day_11_practice
  text: "<b>Контрольный список негативных мыслей </b>\n\nОдна и та же мысль может казаться несомненной в тяжёлом состоянии и почти чужой – в спокойном. Исследования подтверждают: согласие с негативными убеждениями зависит от текущего настроения – оно возрастает в плохом состоянии и снижается в хорошем (Miranda, Persons & Byers, 1990). При этом способность замечать такую изменчивость – воспринимать мысль как событие, а не как факт, – в исследованиях была связана с меньшим риском возвращения тяжёлых состояний (Teasdale et al., 2002). Сегодняшняя практика позволяет увидеть это на собственных мыслях.\n\nВспомните период, когда вы переживали тяжелые состояния. В таблице собраны мысли, которые могли возникнуть тогда – отметьте в столбце А те, что возникли у вас.\n\nДалее оцените, насколько вы верили в каждую из них в пик тяжелого состояния — от 0 («не верил(а) вообще») до 10 («верил(а) полностью») в столбце Б.\n\nТеперь вспомните время, когда вам было хорошо. Пересмотрите те же мысли и поставьте оценки от 0 до 10 в столбце В — насколько вы в них верили, будучи в спокойном состоянии.\n"
